<script type="text/x-sam" id="sam-pages2">
(function () {
  var A = window.A, Store = A.Store;
  var $ = A.$, $$ = A.$$, esc = A.esc, call = A.call, toast = A.toast, Modal = A.Modal, Spinner = A.Spinner, TH = A.TH, hasCap = A.hasCap, fmt = A.fmt, hero = A.hero, emptyBox = A.emptyBox, listSetting = A.listSetting;
  function page() { return document.getElementById('page'); }
  function qp(hash, k) { var m = (hash || location.hash).split('?')[1]; if (!m) return ''; var r = ''; m.split('&').forEach(function (kv) { var p = kv.split('='); if (decodeURIComponent(p[0]) === k) r = decodeURIComponent(p[1] || ''); }); return r; }

  // ═══ STUDENTS ═══
  var STU = { page: 1, q: '', cls: '', room: '', status: 'active', sort: 'class', view: 'grid', rooms: [], classes: [] };
  function renderStudents() {
    var p = page();
    var canEdit = hasCap('student.manage');
    p.innerHTML = hero({ i: 'people-fill', t: 'ข้อมูลนักเรียน' }, 'ข้อมูลนักเรียน', 'ค้นหา · จัดการ · ดูคะแนนความประพฤติรายบุคคล', null) +
      '<div class="panel"><div class="toolbar">' +
        '<div class="search-box"><i class="bi bi-search"></i><input class="input" id="stu-q" placeholder="ค้นหาชื่อ / รหัส / ครูที่ปรึกษา" value="' + esc(STU.q) + '"></div>' +
        '<select class="select" id="stu-cls" style="max-width:130px"><option value="">ทุกชั้น</option></select>' +
        '<select class="select" id="stu-room" style="max-width:120px"><option value="">ทุกห้อง</option></select>' +
        '<select class="select" id="stu-status" style="max-width:150px"><option value="active">กำลังศึกษา</option><option value="">ทั้งหมด</option><option value="left">จำหน่ายออก</option></select>' +
        '<select class="select" id="stu-sort" style="max-width:130px"><option value="class">เรียงตามชั้น</option><option value="score">คะแนนสะสมมากสุด</option><option value="name">ชื่อ</option></select>' +
        '<div class="seg"><button data-view="grid" class="on"><i class="bi bi-grid-3x3-gap"></i></button><button data-view="table"><i class="bi bi-list-ul"></i></button></div>' +
        (canEdit ? '<button class="btn btn-soft" id="stu-import"><i class="bi bi-file-earmark-excel"></i> นำเข้า Excel</button><button class="btn btn-primary" id="stu-add"><i class="bi bi-plus-lg"></i> เพิ่มนักเรียน</button>' : '') +
      '</div><div id="stu-list">' + skel() + '</div></div>';
    ['stu-status', 'stu-sort'].forEach(function (id) { $('#' + id).value = id === 'stu-status' ? STU.status : STU.sort; });
    var q = $('#stu-q'); var timer;
    q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { STU.q = q.value; STU.page = 1; loadStudents(); }, 300); });
    $('#stu-cls').addEventListener('change', function () { STU.cls = this.value; STU.room = ''; STU.page = 1; fillRooms(); loadStudents(); });
    $('#stu-room').addEventListener('change', function () { STU.room = this.value; STU.page = 1; loadStudents(); });
    $('#stu-status').addEventListener('change', function () { STU.status = this.value; STU.page = 1; loadStudents(); });
    $('#stu-sort').addEventListener('change', function () { STU.sort = this.value; STU.page = 1; loadStudents(); });
    $$('[data-view]').forEach(function (b) { b.addEventListener('click', function () { $$('[data-view]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); STU.view = b.getAttribute('data-view'); loadStudents(); }); });
    if (canEdit) { $('#stu-add').addEventListener('click', function () { openStudentModal(null); }); $('#stu-import').addEventListener('click', openImportModal); }
    call('student.classrooms', {}).then(function (d) { STU.classes = d.classes; STU.rooms = d.rooms; fillClasses(); fillRooms(); });
    loadStudents();
  }
  function fillClasses() { var s = $('#stu-cls'); if (!s) return; s.innerHTML = '<option value="">ทุกชั้น</option>' + STU.classes.map(function (c) { return '<option value="' + esc(c) + '"' + (c === STU.cls ? ' selected' : '') + '>ม.' + esc(c) + '</option>'; }).join(''); }
  function fillRooms() { var s = $('#stu-room'); if (!s) return; var rs = STU.rooms.filter(function (r) { return !STU.cls || r.class_level === STU.cls; }); s.innerHTML = '<option value="">ทุกห้อง</option>' + rs.map(function (r) { return '<option value="' + esc(r.room) + '"' + (r.room === STU.room && r.class_level === STU.cls ? ' selected' : '') + '>ม.' + esc(r.class_level) + '/' + esc(r.room) + '</option>'; }).join(''); }
  function skel() { return '<div class="stu-grid">' + '<div class="skel" style="height:130px"></div>'.repeat(6) + '</div>'; }
  function loadStudents() {
    var host = $('#stu-list'); if (!host) return; host.innerHTML = skel();
    call('student.list', { q: STU.q, class_level: STU.cls, room: STU.room, status: STU.status, sort: STU.sort, page: STU.page, per_page: 40 }).then(function (d) {
      if (!$('#stu-list')) return;
      if (!d.items.length) { host.innerHTML = emptyBox('search', 'ไม่พบนักเรียน', 'ลองปรับตัวกรองหรือคำค้นหา'); return; }
      host.innerHTML = STU.view === 'grid' ? gridView(d.items) : tableView(d.items);
      host.innerHTML += A.pager(d.page, d.pages, d.total);
      $$('[data-sid]', host).forEach(function (c) { c.addEventListener('click', function () { A.navTo('#/report/student?id=' + c.getAttribute('data-sid')); }); });
      A.wirePager(host, function (pg) { STU.page = pg; loadStudents(); });
    }).catch(function (e) { host.innerHTML = emptyBox('wifi-off', 'โหลดไม่สำเร็จ', e.message); });
  }
  function gridView(items) {
    return '<div class="stu-grid">' + items.map(function (s) {
      var col = A.scoreColor(s.score);
      return '<div class="stu-card" data-sid="' + esc(s.id) + '"><div class="top"><div class="avatar">' + esc(fmt.initials(s.name)) + '</div><div style="flex:1;min-width:0"><div class="nm">' + esc(s.name) + '</div><div class="meta">ม.' + esc(s.class_level) + '/' + esc(s.room) + ' เลขที่ ' + esc(s.number) + ' · ' + esc(s.id) + ' · <span style="color:' + A.lateColor(s.late_score || 0) + '">มาสาย ' + (s.late_score || 0) + '</span></div></div>' + (s.status === 'left' ? '<span class="badge b-muted">จำหน่าย</span>' : A.alertBadge(s.alert)) + '</div>' +
        '<div class="sc-score"><div class="sc-bar"><div class="sc-fill" style="width:' + Math.min(100, s.score) + '%;background:' + col + '"></div></div><div class="sc-num" style="color:' + col + '">' + s.score + '</div></div></div>';
    }).join('') + '</div>';
  }
  function tableView(items) {
    return '<div class="tbl-wrap"><table class="data-table rc"><thead><tr><th>นักเรียน</th><th>ชั้น/ห้อง</th><th class="t-center">เลขที่</th><th class="t-num">ความประพฤติ</th><th class="t-num">มาสาย</th><th>ครูที่ปรึกษา</th><th></th></tr></thead><tbody>' +
      items.map(function (s) { var col = A.scoreColor(s.score);
        return '<tr data-sid="' + esc(s.id) + '" style="cursor:pointer"><td data-label="นักเรียน"><div class="stu-cell"><div class="avatar sm">' + esc(fmt.initials(s.name)) + '</div><div><div class="nm">' + esc(s.name) + '</div><div class="sub">' + esc(s.id) + '</div></div></div></td>' +
          '<td data-label="ชั้น/ห้อง">ม.' + esc(s.class_level) + '/' + esc(s.room) + '</td><td data-label="เลขที่" class="t-center">' + esc(s.number) + '</td>' +
          '<td data-label="ความประพฤติ" class="t-num"><b style="color:' + col + '">' + s.score + '</b></td><td data-label="มาสาย" class="t-num"><b style="color:' + A.lateColor(s.late_score || 0) + '">' + (s.late_score || 0) + '</b></td><td data-label="ครูที่ปรึกษา">' + esc(s.advisor_name || '-') + '</td>' +
          '<td class="t-center">' + (s.status === 'left' ? '<span class="badge b-muted">จำหน่าย</span>' : A.alertBadge(s.alert)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  A.route('#/students', renderStudents);

  function openStudentModal(s) {
    var isNew = !s;
    Modal.open({
      title: isNew ? 'เพิ่มนักเรียน' : 'แก้ไขนักเรียน', icon: 'person-plus', large: true,
      html: '<form id="st-form"><div class="grid-2" style="gap:12px"><div class="field"><label>รหัสนักเรียน <span class="req">*</span></label><input class="input" name="id" value="' + esc(s ? s.id : '') + '"' + (isNew ? '' : ' readonly') + ' placeholder="เช่น 30001"></div>' +
        '<div class="field"><label>คำนำหน้า</label><input class="input" name="prefix" value="' + esc(s ? s.prefix : '') + '" placeholder="เด็กชาย/นาย/นางสาว"></div></div>' +
        '<div class="grid-2" style="gap:12px"><div class="field"><label>ชื่อ <span class="req">*</span></label><input class="input" name="first_name" value="' + esc(s ? s.first_name : '') + '"></div>' +
        '<div class="field"><label>นามสกุล</label><input class="input" name="last_name" value="' + esc(s ? s.last_name : '') + '"></div></div>' +
        '<div class="grid-3" style="gap:12px"><div class="field"><label>ชั้น <span class="req">*</span></label><input class="input" name="class_level" value="' + esc(s ? s.class_level : '') + '" placeholder="1-6"></div>' +
        '<div class="field"><label>ห้อง <span class="req">*</span></label><input class="input" name="room" value="' + esc(s ? s.room : '') + '"></div>' +
        '<div class="field"><label>เลขที่</label><input class="input" name="number" value="' + esc(s ? s.number : '') + '"></div></div>' +
        '<div class="field"><label>ครูที่ปรึกษา</label><input class="input" name="advisor_name" value="' + esc(s ? s.advisor_name : '') + '"></div>' +
        (isNew ? '' : '<div class="field"><label>สถานะ</label><select class="select" name="status"><option value="active"' + (s.status === 'active' ? ' selected' : '') + '>กำลังศึกษา</option><option value="left"' + (s.status === 'left' ? ' selected' : '') + '>จำหน่ายออก</option></select></div>') + '</form>',
      footer: (isNew ? '' : '<button class="btn btn-danger" id="st-del" style="margin-right:auto"><i class="bi bi-trash"></i> จำหน่ายออก</button>') + '<button class="btn btn-ghost" data-action="close-modal">ยกเลิก</button><button class="btn btn-primary" id="st-save"><i class="bi bi-check-lg"></i> บันทึก</button>',
      onOpen: function (card) {
        $('#st-save', card).addEventListener('click', function (ev) {
          var f = $('#st-form', card), pl = { is_new: isNew };
          ['id', 'prefix', 'first_name', 'last_name', 'class_level', 'room', 'number', 'advisor_name', 'status'].forEach(function (k) { if (f[k]) pl[k] = f[k].value; });
          A.runBtn(ev.currentTarget, function () { return call('student.save', pl).then(function () { A.invalidateClassrooms(); toast('บันทึกนักเรียนแล้ว', 'success'); Modal.close(); loadStudents(); }); }).catch(function () {});
        });
        if (!isNew) $('#st-del', card).addEventListener('click', function () {
          A.confirm({ title: 'จำหน่ายนักเรียนออก?', message: s.first_name + ' จะถูกตั้งสถานะ "จำหน่ายออก" (ข้อมูลยังเก็บไว้)', okText: 'จำหน่ายออก', danger: true }).then(function (ok) { if (!ok) return; call('student.delete', { id: s.id }).then(function () { toast('จำหน่ายนักเรียนแล้ว', 'success'); Modal.close(); loadStudents(); }).catch(function (e) { toast(e.message, 'error'); }); });
        });
      }
    });
  }

  // ── import wizard ──
  function openImportModal() {
    var rows = [];
    Modal.open({
      title: 'นำเข้าข้อมูลนักเรียน', icon: 'file-earmark-excel', large: true,
      html: '<div id="imp-step1"><div class="drop-zone" id="imp-drop"><i class="bi bi-cloud-arrow-up"></i><div class="t">เลือกไฟล์ Excel (.xlsx) หรือ CSV</div><div class="s">คอลัมน์: รหัส, คำนำหน้า, ชื่อ, นามสกุล, ชั้น, ห้อง, เลขที่, ครูที่ปรึกษา</div></div>' +
        '<input type="file" accept=".xlsx,.xls,.csv" id="imp-file" hidden>' +
        '<div style="margin-top:12px;text-align:center"><button class="btn btn-ghost btn-sm" id="imp-tmpl"><i class="bi bi-download"></i> ดาวน์โหลดแม่แบบ CSV</button></div></div>' +
        '<div id="imp-step2" style="display:none"></div>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">ปิด</button><button class="btn btn-primary" id="imp-run" style="display:none"><i class="bi bi-check-lg"></i> นำเข้าข้อมูล</button>',
      onOpen: function (card) {
        var fileInp = $('#imp-file', card), drop = $('#imp-drop', card);
        drop.addEventListener('click', function () { fileInp.click(); });
        drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('drag'); });
        drop.addEventListener('dragleave', function () { drop.classList.remove('drag'); });
        drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('drag'); if (e.dataTransfer.files[0]) parseFile(e.dataTransfer.files[0], card); });
        fileInp.addEventListener('change', function () { if (fileInp.files[0]) parseFile(fileInp.files[0], card); });
        $('#imp-tmpl', card).addEventListener('click', function () {
          var csv = '﻿รหัส,คำนำหน้า,ชื่อ,นามสกุล,ชั้น,ห้อง,เลขที่,ครูที่ปรึกษา\n30001,เด็กชาย,สมชาย,ใจดี,1,1,1,ครูสมศรี\n';
          var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'แม่แบบนักเรียน.csv'; a.click();
        });
      }
    });
    function parseFile(file, card) {
      var name = file.name.toLowerCase();
      if (/\.csv$/.test(name)) { var rd = new FileReader(); rd.onload = function () { showPreview(parseCsv(rd.result), card); }; rd.readAsText(file, 'UTF-8'); }
      else { loadXlsx().then(function (XLSX) { var rd = new FileReader(); rd.onload = function () { var wb = XLSX.read(new Uint8Array(rd.result), { type: 'array' }); var arr = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 }); showPreview(arr, card); }; rd.readAsArrayBuffer(file); }).catch(function (e) { toast('โหลดตัวอ่าน Excel ไม่สำเร็จ: ' + e.message, 'error'); }); }
    }
    function parseCsv(txt) { return txt.replace(/^﻿/, '').split(/\r?\n/).filter(Boolean).map(function (l) { return l.split(','); }); }
    function showPreview(arr, card) {
      if (!arr || arr.length < 2) { toast('ไฟล์ว่างหรือรูปแบบไม่ถูกต้อง', 'warning'); return; }
      var head = arr[0].map(function (x) { return String(x || '').trim(); });
      var idx = mapCols(head);
      rows = arr.slice(1).map(function (r) { return { id: cell(r, idx.id), prefix: cell(r, idx.prefix), first_name: cell(r, idx.first), last_name: cell(r, idx.last), class_level: cell(r, idx.cls), room: cell(r, idx.room), number: cell(r, idx.no), advisor_name: cell(r, idx.adv) }; }).filter(function (r) { return r.id; });
      $('#imp-step1', card).style.display = 'none';
      var s2 = $('#imp-step2', card); s2.style.display = 'block';
      s2.innerHTML = '<div class="imp-stat"><span class="imp-badge b-ok"><i class="bi bi-check-circle"></i> พบ ' + rows.length + ' รายการ</span></div>' +
        '<div class="imp-preview"><table class="data-table"><thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>ชั้น/ห้อง</th></tr></thead><tbody>' +
        rows.slice(0, 8).map(function (r) { return '<tr><td>' + esc(r.id) + '</td><td>' + esc((r.prefix || '') + r.first_name + ' ' + r.last_name) + '</td><td>ม.' + esc(r.class_level) + '/' + esc(r.room) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
        (rows.length > 8 ? '<div class="field-hint" style="text-align:center;margin-top:8px">และอีก ' + (rows.length - 8) + ' รายการ</div>' : '');
      var runBtn = $('#imp-run'); runBtn.style.display = 'inline-flex';
      runBtn.onclick = function (ev) { A.runBtn(ev.currentTarget, function () { return call('student.import', { rows: rows }).then(function (r) { A.invalidateClassrooms(); toast('นำเข้าสำเร็จ: เพิ่ม ' + r.created + ' · อัปเดต ' + r.updated + ' · ข้าม ' + r.skipped, 'success', 5000); Modal.close(); loadStudents(); }); }, { loading: 'กำลังนำเข้า…' }).catch(function () {}); };
    }
    function mapCols(head) { function find(keys) { for (var i = 0; i < head.length; i++) { var h = head[i].toLowerCase(); if (keys.some(function (k) { return h.indexOf(k) >= 0; })) return i; } return -1; } return { id: find(['รหัส', 'id', 'code']), prefix: find(['คำนำหน้า', 'prefix']), first: find(['ชื่อ', 'first']), last: find(['นามสกุล', 'สกุล', 'last']), cls: find(['ชั้น', 'class', 'level']), room: find(['ห้อง', 'room']), no: find(['เลขที่', 'number', 'no']), adv: find(['ปรึกษา', 'advisor']) }; }
    function cell(r, i) { return i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : ''; }
  }
  var _xlsx = null;
  function loadXlsx() {
    if (_xlsx) return Promise.resolve(_xlsx);
    if (window.XLSX) { _xlsx = window.XLSX; return Promise.resolve(_xlsx); }
    var cdns = ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
    return new Promise(function (resolve, reject) {
      function tryLoad(i) { if (window.XLSX) { _xlsx = window.XLSX; return resolve(_xlsx); } if (i >= cdns.length) return reject(new Error('โหลดไม่สำเร็จ')); var s = document.createElement('script'); s.src = cdns[i]; s.onload = function () { if (window.XLSX) { _xlsx = window.XLSX; resolve(_xlsx); } else tryLoad(i + 1); }; s.onerror = function () { tryLoad(i + 1); }; document.head.appendChild(s); }
      tryLoad(0);
    });
  }

  // ═══ RECORD LISTS (generic) ═══
  var REC = {};
  function recordListPage(cfg) {
    if (!REC[cfg.key]) REC[cfg.key] = { page: 1, q: '', from: '', to: '', cls: '', room: '' };
    var st = REC[cfg.key], p = page();
    p.innerHTML = hero({ i: cfg.icon, t: cfg.pill }, cfg.title, cfg.sub, null) +
      '<div class="panel"><div class="toolbar">' +
        '<div class="search-box"><i class="bi bi-search"></i><input class="input" id="rc-q" placeholder="ค้นหาชื่อ / รหัส" value="' + esc(st.q) + '"></div>' +
        '<input type="date" class="input" id="rc-from" value="' + esc(st.from) + '" style="max-width:150px">' +
        '<input type="date" class="input" id="rc-to" value="' + esc(st.to) + '" style="max-width:150px">' +
        (cfg.kind ? '<select class="select" id="rc-kind" style="max-width:140px"><option value="">ทุกประเภท</option><option value="deduct">หักคะแนน</option><option value="add">เพิ่มคะแนน</option></select>' : '') +
        '<button class="btn btn-ghost btn-sm" id="rc-clear"><i class="bi bi-x-circle"></i> ล้าง</button>' +
        '<button class="btn btn-ghost btn-sm" id="rc-print" style="margin-left:auto"><i class="bi bi-printer"></i> พิมพ์</button>' +
      '</div><div id="rc-list">' + '<div class="skel" style="height:200px"></div>' + '</div></div>';
    var q = $('#rc-q'), timer;
    q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { st.q = q.value; st.page = 1; load(); }, 300); });
    $('#rc-from').addEventListener('change', function () { st.from = this.value; st.page = 1; load(); });
    $('#rc-to').addEventListener('change', function () { st.to = this.value; st.page = 1; load(); });
    if (cfg.kind) $('#rc-kind').addEventListener('change', function () { st.kind = this.value; st.page = 1; load(); });
    $('#rc-clear').addEventListener('click', function () { st.q = ''; st.from = ''; st.to = ''; st.kind = ''; st.page = 1; recordListPage(cfg); });
    $('#rc-print').addEventListener('click', function (ev) {
      A.runBtn(ev.currentTarget, function () {
        // ดึง "ทุกรายการตามตัวกรอง" ไม่ใช่แค่หน้าที่เปิดอยู่
        return cfg.fetch({ q: st.q, from: st.from, to: st.to, kind: st.kind, page: 1, per_page: 1000 }).then(function (d) {
          if (!d.items.length) { toast('ไม่มีข้อมูลให้พิมพ์', 'warning'); return; }

        A.confirm({ title: 'ขึ้นภาคเรียนใหม่?', message: 'เปลี่ยนเป็น ' + nextTxt + ' — คะแนนมาสายของทุกคนเริ่มนับใหม่ที่ 0 (รายการมาสายเก่ายังเก็บไว้ · คะแนนความประพฤติไม่เปลี่ยน)', okText: 'ขึ้นภาคเรียนใหม่', danger: true }).then(function (ok) {
          if (!ok) return;
          A.runBtn(ev.currentTarget, function () {
            return call('term.next', {}).then(function (r) {
              Store.boot.settings.academic_year = r.academic_year; Store.boot.settings.current_term = r.current_term;
              Swal.fire({ icon: 'success', title: 'ขึ้นภาคเรียน ' + r.term + ' แล้ว', html: 'คะแนนมาสายเริ่มนับใหม่ ' + r.late_fixed + ' คน', confirmButtonColor: '#2563eb' }).then(function () { A.navTo('#/admin/settings'); });
            });
          }, { loading: 'กำลังเปลี่ยนภาคเรียน…' }).catch(function () {});
        });
      });
      $('#set-reset-score').addEventListener('click', function () { A.confirm({ title: 'รีเซ็ตคะแนนทุกคน?', message: 'ตั้งคะแนนความประพฤติและคะแนนมาสายของนักเรียนทุกคนเป็น 0 (ประวัติเก่ายังเก็บไว้ · ใช้ตอนขึ้นปีการศึกษาใหม่)', okText: 'รีเซ็ตคะแนน', danger: true }).then(function (ok) { if (!ok) return; call('student.reset_scores', {}).then(function (r) { toast('รีเซ็ตคะแนน ' + r.count + ' คนแล้ว', 'success'); }).catch(function (e) { toast(e.message, 'error'); }); }); });
      $('#tg-me').addEventListener('click', function () { Spinner.show('กำลังตรวจ Bot…'); call('tg.get_me', {}).then(function (r) { Spinner.hide(); Swal.fire({ icon: 'success', title: 'Bot: ' + esc(r.name), html: '@' + esc(r.username) + '<br><a href="' + esc(r.link) + '" target="_blank">เปิดแชตบอท</a>', confirmButtonColor: '#2563eb' }); }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); }); });
      $('#tg-ids').addEventListener('click', function () { Spinner.show('กำลังดึง Chat ID…'); call('tg.get_updates', {}).then(function (r) { Spinner.hide(); Modal.open({ title: 'Chat ID ที่ทักบอท', icon: 'people', html: r.chats.length ? '<div class="tbl-wrap"><table class="data-table"><thead><tr><th>ชื่อ</th><th>Chat ID</th></tr></thead><tbody>' + r.chats.map(function (c) { return '<tr><td>' + esc(c.name) + '</td><td><code>' + esc(c.id) + '</code></td></tr>'; }).join('') + '</tbody></table></div><div class="field-hint" style="margin-top:8px">คัดลอก Chat ID ไปใส่ในช่อง "Chat ID ผู้ดูแล"</div>' : '<div class="field-hint">ยังไม่มีใครทักบอท — ส่งลิงก์บอทให้ผู้ดูแลกด /start ก่อน</div>' }); }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); }); });
      $('#tg-test').addEventListener('click', function () { Spinner.show('กำลังส่งข้อความทดสอบ…'); call('tg.test', {}).then(function (r) { Spinner.hide(); toast('ส่งสำเร็จ ' + r.sent + '/' + r.total, 'success'); }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); }); });
    }).catch(function (e) { if (page()) page().innerHTML = emptyBox('wifi-off', 'โหลดไม่สำเร็จ', e.message); });
  });

  // ═══ ADMIN: AUDIT ═══
  A.route('#/admin/audit', function () {
    var p = page();
    p.innerHTML = hero({ i: 'shield-check', t: 'ประวัติการใช้งาน' }, 'ประวัติการใช้งาน (Audit Log)', 'บันทึกการเข้าใช้ · แก้ไข · ลบ · เปลี่ยนสิทธิ์', null) +
      '<div class="panel"><div class="toolbar"><div class="search-box"><i class="bi bi-search"></i><input class="input" id="au-q" placeholder="ค้นหาผู้ใช้/การกระทำ"></div></div><div id="au-list">' + '<div class="skel" style="height:300px"></div>' + '</div></div>';
    var q = $('#au-q'), timer;
    q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { loadAudit(q.value); }, 300); });
    loadAudit('');
  });
  function loadAudit(q) {
    var host = $('#au-list'); if (!host) return; host.innerHTML = '<div class="skel" style="height:300px"></div>';
    var labels = { 'auth.login': 'เข้าสู่ระบบ', 'auth.fail': 'ล็อกอินล้มเหลว', 'student.create': 'เพิ่มนักเรียน', 'student.update': 'แก้ไขนักเรียน', 'student.delete': 'จำหน่ายนักเรียน', 'student.import': 'นำเข้านักเรียน', 'late.create': 'บันทึกมาสาย', 'late.cancel': 'ยกเลิกมาสาย', 'leave.create': 'บันทึกลากลับ', 'leave.cancel': 'ยกเลิกลากลับ', 'behavior.deduct': 'หักคะแนน', 'behavior.add': 'เพิ่มคะแนน', 'behavior.cancel': 'ยกเลิกคะแนน', 'offense.create': 'เพิ่มฐานความผิด', 'offense.update': 'แก้ฐานความผิด', 'offense.delete': 'ลบฐานความผิด', 'user.create': 'เพิ่มผู้ใช้', 'user.update': 'แก้ผู้ใช้', 'user.delete': 'ลบผู้ใช้', 'user.reset_password': 'รีเซ็ตรหัสผ่าน', 'setting.update': 'แก้ตั้งค่า', 'score.reset': 'รีเซ็ตคะแนน', 'score.recompute': 'คำนวณคะแนนใหม่', 'term.next': 'ขึ้นภาคเรียนใหม่', 'migrate.v110': 'ย้ายข้อมูล v1.1.0 (อัตโนมัติ)', 'late.self': 'นักเรียนบันทึกมาสายเอง', 'leave.self': 'นักเรียนยื่นลากลับเอง', 'file.upload': 'อัปโหลดไฟล์' };
    call('audit.list', { q: q, limit: 300 }).then(function (d) {
      if (!$('#au-list')) return;
      if (!d.items.length) { host.innerHTML = emptyBox('clipboard', 'ไม่มีประวัติ'); return; }
      host.innerHTML = '<div class="tbl-wrap"><table class="data-table rc"><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายละเอียด</th></tr></thead><tbody>' +
        d.items.map(function (r) { return '<tr><td data-label="เวลา">' + TH.date(r.at) + ' ' + TH.time(r.at) + '</td><td data-label="ผู้ใช้">' + esc(r.user_name || '-') + '</td><td data-label="การกระทำ"><span class="badge b-info">' + esc(labels[r.action] || r.action) + '</span></td><td data-label="รายละเอียด" style="font-size:11.5px;color:var(--muted)">' + esc(r.entity + (r.entity_id ? ' · ' + r.entity_id : '')) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }).catch(function (e) { host.innerHTML = emptyBox('wifi-off', 'โหลดไม่สำเร็จ', e.message); });
  }
})();
</script>
