  Notice: ห้ามจำหน่าย · แบ่งปันเพื่อการศึกษาและต่อยอดเท่านั้น (ใช้เชิงพาณิชย์ต้องได้รับอนุญาตจากผู้พัฒนา)
═══════════════════════════════════════════════════════════════ -->
<script type="text/x-sam" id="sam-pages">
(function () {
  var A = window.A, Store = A.Store;
  var $ = A.$, $$ = A.$$, esc = A.esc, call = A.call, toast = A.toast, Modal = A.Modal, Spinner = A.Spinner, TH = A.TH, hasCap = A.hasCap, fmt = A.fmt;
  function page() { return document.getElementById('page'); }

  // ── shared ui helpers ──
  function hero(pill, title, sub, kpis, grad) {
    var k = kpis ? '<div class="kpi-row">' + kpis.map(function (x) { return '<div class="kpi"><div class="kpi-ic"><i class="bi bi-' + x.i + '"></i></div><div class="kpi-val">' + esc(x.v) + '</div><div class="kpi-lb">' + esc(x.l) + '</div></div>'; }).join('') + '</div>' : '';
    return '<div class="hero"><div class="hero-in"><div class="hero-pill"><i class="bi bi-' + (pill.i || 'stars') + '"></i> ' + esc(pill.t) + '</div>' +
      '<h1 class="hero-title">' + esc(title) + '</h1><div class="hero-sub">' + esc(sub) + '</div>' + k + '</div></div>';
  }
  function greeting() { var h = new Date().getHours(); return h < 12 ? 'อรุณสวัสดิ์' : (h < 17 ? 'สวัสดีตอนบ่าย' : 'สวัสดีตอนเย็น'); }
  function skelBlock(h) { return '<div class="skel" style="height:' + (h || 120) + 'px;border-radius:16px;margin-bottom:14px"></div>'; }
  function loadingPage() { return skelBlock(150) + '<div class="sd-grid">' + skelBlock(110) + skelBlock(110) + skelBlock(110) + skelBlock(110) + '</div>' + skelBlock(220); }
  function emptyBox(icon, title, sub) { return '<div class="empty"><i class="bi bi-' + icon + '"></i><div class="t">' + esc(title) + '</div>' + (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>'; }
  A.emptyBox = emptyBox; A.hero = hero;

  // ═══ DASHBOARD ═══
  function renderDashboard() {
    var p = page(); p.innerHTML = loadingPage();
    call('report.dashboard', {}).then(function (d) {
      if (!page()) return;
      var u = Store.user, k = d.kpi;
      var kpis = [
        { i: 'clock-history', v: fmt.num(k.late), l: 'มาสายวันนี้' },
        { i: 'house-heart', v: fmt.num(k.leave), l: 'ลากลับวันนี้' },
        { i: 'star', v: fmt.num(k.behavior), l: 'บันทึกพฤติกรรม' },
        { i: 'dash-circle', v: fmt.num(k.deduct), l: 'หักคะแนนวันนี้' },
        { i: 'exclamation-triangle', v: fmt.num(k.at_risk), l: 'คะแนนต่ำกว่าเกณฑ์' }
      ];
      var quick = quickActions();
      var trend = A.svgLine(d.trend, { keys: [{ key: 'late', color: '#2563eb', label: 'มาสาย' }, { key: 'leave', color: '#0ea5e9', label: 'ลากลับ' }] });
      p.innerHTML =
        hero({ i: 'shield-check', t: TH.dateWeekday(d.date) }, greeting() + ' · คุณ' + u.full_name.replace(/^(นาย|นาง|นางสาว)/, ''), 'ภาพรวมงานปกครองประจำวันของ' + (Store.boot.app.org || 'โรงเรียน'), kpis) +
        (quick ? '<div class="panel"><div class="panel-h"><div class="pi"><i class="bi bi-lightning-charge-fill"></i></div><div class="pt">เมนูด่วน</div></div><div class="app-grid">' + quick + '</div></div>' : '') +
        (d.at_risk.length ? '<div class="panel" style="border-left:4px solid var(--danger)"><div class="panel-h"><div class="pi" style="background:#fef2f2;color:#dc2626"><i class="bi bi-exclamation-octagon-fill"></i></div><div class="pt">นักเรียนคะแนนสะสมถึงเกณฑ์</div><div class="right"><span class="badge b-danger">' + d.at_risk.length + ' คน</span></div></div>' +
          '<div class="stu-grid">' + d.at_risk.slice(0, 8).map(function (s) { return riskCard(s); }).join('') + '</div></div>' : '') +
        '<div class="grid-2c"><div class="chart-card"><div class="chart-h"><i class="bi bi-graph-up"></i> แนวโน้ม 7 วัน (มาสาย/ลากลับ)</div>' + trend +
          '<div class="legend"><span class="lg-i"><span class="lg-d" style="background:#2563eb"></span> มาสาย</span><span class="lg-i"><span class="lg-d" style="background:#0ea5e9"></span> ลากลับ</span></div></div>' +
          '<div class="panel"><div class="panel-h"><div class="pi"><i class="bi bi-list-stars"></i></div><div class="pt">สรุปวันนี้</div></div>' +
          '<div class="sd-grid" style="grid-template-columns:1fr 1fr">' + statMini('clock-history', 'g-amber', k.late, 'มาสาย') + statMini('house-heart', 'g-sky', k.leave, 'ลากลับ') + statMini('dash-circle', 'g-rose', k.deduct, 'หักคะแนน') + statMini('exclamation-triangle', 'g-slate', k.at_risk, 'เสี่ยง') + '</div></div></div>' +
        '<div class="grid-2">' + feedPanel('มาสายล่าสุด', 'clock-history', 'g-amber', d.late, 'late') + feedPanel('ลากลับล่าสุด', 'house-heart', 'g-sky', d.leave, 'leave') + '</div>' +
        (d.behavior.length ? '<div class="panel"><div class="panel-h"><div class="pi" style="background:#fef2f2;color:#dc2626"><i class="bi bi-star-fill"></i></div><div class="pt">บันทึกพฤติกรรมวันนี้</div></div>' + behaviorFeed(d.behavior) + '</div>' : '');
      $$('.stu-card', p).forEach(function (c) { c.addEventListener('click', function () { A.navTo('#/report/student?id=' + c.getAttribute('data-sid')); }); });
    }).catch(function (e) { if (page()) page().innerHTML = emptyBox('wifi-off', 'โหลดแดชบอร์ดไม่สำเร็จ', e.message); });
  }
  function statMini(icon, grad, val, lb) { return '<div class="stat"><div class="stat-ic ' + grad + '"><i class="bi bi-' + icon + '"></i></div><div class="stat-val">' + fmt.num(val) + '</div><div class="stat-lb">' + esc(lb) + '</div></div>'; }
  function riskCard(s) {
    var col = A.scoreColor(s.score);
    return '<div class="stu-card" data-sid="' + esc(s.id) + '"><div class="top"><div class="avatar">' + esc(fmt.initials(s.name)) + '</div><div style="flex:1;min-width:0"><div class="nm">' + esc(s.name) + '</div><div class="meta">' + esc(s.class_room) + ' · ' + esc(s.id) + ' · มาสาย ' + (s.late_score || 0) + '</div></div>' + A.alertBadge(s.alert) + '</div>' +
      '<div class="sc-score"><div class="sc-bar"><div class="sc-fill" style="width:' + Math.min(100, s.score) + '%;background:' + col + '"></div></div><div class="sc-num" style="color:' + col + '">' + s.score + '</div></div></div>';
  }
  function feedPanel(title, icon, grad, items, kind) {
    var body = items.length ? '<div class="feed">' + items.slice(0, 8).map(function (r) {
      var extra = kind === 'leave' ? ('ผู้รับ: ' + r.guardian) : ('สาเหตุ: ' + r.reason);
      return '<div class="fi"><div class="fic ' + grad + '"><i class="bi bi-' + icon + '"></i></div><div class="fb"><div class="ft">' + esc(r.name) + '</div><div class="fm">' + esc(r.class_room) + ' · ' + esc(extra) + '</div></div><div class="fr"><span class="ftime">' + esc(r.time) + '</span> น.</div></div>';
    }).join('') + '</div>' : emptyBox('inbox', 'ยังไม่มีข้อมูลวันนี้');
    return '<div class="panel"><div class="panel-h"><div class="pi ' + grad + '" style="color:#fff"><i class="bi bi-' + icon + '"></i></div><div class="pt">' + esc(title) + '</div><div class="right"><span class="badge b-muted">' + items.length + '</span></div></div>' + body + '</div>';
  }
  function behaviorFeed(items) {
    return '<div class="feed">' + items.slice(0, 12).map(function (r) {
      var neg = r.points < 0;
      return '<div class="fi"><div class="fic ' + (neg ? 'g-rose' : 'g-emerald') + '"><i class="bi bi-' + (neg ? 'dash-lg' : 'plus-lg') + '"></i></div><div class="fb"><div class="ft">' + esc(r.name) + ' · ' + esc(r.offense_name) + '</div><div class="fm">' + esc(r.class_room) + ' · โดย ' + esc(r.by) + '</div></div><div class="fr"><span class="pts-chip ' + (neg ? 'pts-neg' : 'pts-pos') + '">' + (neg ? '' : '+') + r.points + '</span><div style="font-size:11px;color:#94a3b8">สะสม ' + r.score_after + '</div></div></div>';
    }).join('') + '</div>';
  }
  function quickActions() {
    var acts = [];
    if (hasCap('late.create')) acts.push({ h: '#/scan/late', i: 'clock-history', t: 'บันทึกมาสาย', g: 'g-amber' });
    if (hasCap('leave.create')) acts.push({ h: '#/scan/leave', i: 'house-heart', t: 'ลากลับ', g: 'g-sky' });
    if (hasCap('behavior.create')) acts.push({ h: '#/scan/behavior', i: 'star', t: 'หักคะแนน', g: 'g-rose' });
    if (hasCap('student.view_own|student.view_all')) acts.push({ h: '#/students', i: 'people-fill', t: 'นักเรียน', g: 'g-indigo' });
    if (hasCap('report.view_own|report.view_all')) acts.push({ h: '#/report/period', i: 'bar-chart-line', t: 'รายงาน', g: 'g-violet' });
    if (hasCap('setting.manage')) acts.push({ h: '#/admin/settings', i: 'sliders', t: 'ตั้งค่า', g: 'g-slate' });
    if (!acts.length) return '';
    return acts.map(function (a) { return '<a class="app-tile" href="' + a.h + '"><span class="ic ' + a.g + '"><i class="bi bi-' + a.i + '"></i></span><span class="lb">' + esc(a.t) + '</span></a>'; }).join('');
  }
  A.route('#/dashboard', renderDashboard);

  // ═══ LIVE BOARD — จอแยก 2 ฝั่ง (ซ้ายมาสาย · ขวาลากลับ) เฉพาะวันนี้ · รีเฟรชอัตโนมัติ ═══
  var BOARD_TIMER = null;
  function renderBoard() {
    if (BOARD_TIMER) { clearInterval(BOARD_TIMER); BOARD_TIMER = null; }
    var p = page();
    p.innerHTML = hero({ i: 'display', t: 'กระดานสด' }, 'กระดานสรุปวันนี้', 'มาสาย · ลากลับ — แสดงเฉพาะวันนี้ · รีเฟรชอัตโนมัติ · ขึ้นวันใหม่ล้างเอง', null) +
      '<div class="board-wrap">' +
        '<div class="board-col"><div class="board-h amber"><span class="bt"><i class="bi bi-clock-history"></i> มาสายวันนี้</span><span class="bc" id="board-late-c">0</span></div><div class="board-body" id="board-late"></div></div>' +
        '<div class="board-col"><div class="board-h sky"><span class="bt"><i class="bi bi-house-heart"></i> ขอกลับบ้านวันนี้</span><span class="bc" id="board-leave-c">0</span></div><div class="board-body" id="board-leave"></div></div>' +
      '</div><div class="board-foot" id="board-foot">กำลังโหลด…</div>' +
      '<div class="board-act sd-no-print"><button class="btn btn-ghost btn-sm" id="board-print"><i class="bi bi-printer"></i> พิมพ์กระดานวันนี้</button></div>';
    $('#board-print').addEventListener('click', function (ev) {
      A.runBtn(ev.currentTarget, function () {
        return call('board.today', {}).then(function (d) {
          if (!d.late.length && !d.leave.length) { toast('วันนี้ยังไม่มีรายการ', 'warning'); return; }
          A.printDoc({
            title: 'สรุปมาสาย / ขอกลับบ้าน ประจำวัน', sub: TH.dateWeekday(new Date()),
            summary: '<b>สรุป:</b> มาสาย ' + d.late_count + ' คน · ขอกลับบ้าน ' + d.leave_count + ' คน',
            html: '<h3 style="font-family:Kanit;font-size:13pt;margin:10px 0 6px">มาสายวันนี้ (' + d.late_count + ')</h3>' +
              A.prTable([
                { label: 'เวลา', k: 'time' }, { label: 'รหัส', k: 'sid' }, { label: 'ชื่อ-สกุล', k: 'name' },
                { label: 'ชั้น/ห้อง', k: 'cr' }, { label: 'ครูที่ปรึกษา', fmt: function (r) { return r.advisor || '-'; } },
                { label: 'สาเหตุ', k: 'reason' }
              ], d.late) +
              '<h3 style="font-family:Kanit;font-size:13pt;margin:12px 0 6px">ขอกลับบ้านวันนี้ (' + d.leave_count + ')</h3>' +
              A.prTable([
                { label: 'เวลา', k: 'time' }, { label: 'รหัส', k: 'sid' }, { label: 'ชื่อ-สกุล', k: 'name' },
                { label: 'ชั้น/ห้อง', k: 'cr' }, { label: 'ครูที่ปรึกษา', fmt: function (r) { return r.advisor || '-'; } },
                { label: 'เหตุผล', k: 'reason' }, { label: 'ผู้มารับ', fmt: function (r) { return (r.guardian || '-') + (r.relation ? ' (' + r.relation + ')' : ''); } },
                { label: 'เบอร์โทร', fmt: function (r) { return r.phone || '-'; } }
              ], d.leave)
          });
        });
      }, { loading: 'กำลังเตรียมเอกสาร…' }).catch(function () {});
    });
    loadBoard(false);
    BOARD_TIMER = setInterval(function () {
      if (!page() || location.hash !== '#/board') { clearInterval(BOARD_TIMER); BOARD_TIMER = null; return; }
      loadBoard(true);
    }, 20000);
  }
  function boardItem(r, isLeave) {
    var body = '<div class="bnm">' + esc(r.name) + (r.self ? ' <span class="bself">นักเรียนบันทึก</span>' : '') + '</div>' +
      '<div class="bmeta">รหัส ' + esc(r.sid || '-') + ' · ' + esc(r.cr) + (r.advisor ? ' · ครูที่ปรึกษา: ' + esc(r.advisor) : '') + '</div>' +
      '<div class="bmeta2"><i class="bi bi-chat-left-text"></i> ' + esc(r.reason || '-') + '</div>';
    if (isLeave) {
      body += '<div class="bmeta2"><i class="bi bi-person-heart"></i> ผู้ปกครอง: ' + esc(r.guardian || '-') + (r.relation ? ' (' + esc(r.relation) + ')' : '') +
        (r.phone ? ' · <a href="tel:' + esc(r.phone) + '" class="btel"><i class="bi bi-telephone-fill"></i> ' + esc(r.phone) + '</a>' : '') + '</div>';
      if (r.photo) body += '<button type="button" class="board-photo" data-photo="' + esc(r.photo) + '"><i class="bi bi-image"></i> ดูรูปหลักฐาน</button>';
    }
    return '<div class="brow' + (r.self ? ' self' : '') + '"><div class="btime">' + esc(r.time) + '</div><div class="bmain">' + body + '</div></div>';
  }
  function boardEmpty(t) { return '<div class="board-empty"><i class="bi bi-inbox"></i><div>' + esc(t) + '</div></div>'; }
  function loadBoard(silent) {
    if (!silent) { var ff = $('#board-foot'); if (ff) ff.textContent = 'กำลังโหลด…'; }
    call('board.today', {}).then(function (d) {
      if (!page() || location.hash !== '#/board') return;
      $('#board-late-c').textContent = d.late_count; $('#board-leave-c').textContent = d.leave_count;
      $('#board-late').innerHTML = d.late.length ? d.late.map(function (r) { return boardItem(r, false); }).join('') : boardEmpty('ยังไม่มีรายการมาสายวันนี้');
      $('#board-leave').innerHTML = d.leave.length ? d.leave.map(function (r) { return boardItem(r, true); }).join('') : boardEmpty('ยังไม่มีรายการขอกลับบ้านวันนี้');
      $('#board-foot').innerHTML = '<i class="bi bi-broadcast"></i> ' + esc(TH.date(new Date())) + ' · อัปเดตล่าสุด ' + esc(d.server_time) + ' น. · รีเฟรชทุก 20 วินาที';
    }).catch(function (e) { var ff = $('#board-foot'); if (ff) ff.textContent = e.message; });
  }
  A.route('#/board', renderBoard);

  // ═══ SCAN FRAMEWORK ═══
  var SCAN = { student: null, reason: '', feed: [], offense: null, offenses: [], photo: '', kind: '' };

  function scanShell(cfg) {
    SCAN = { student: null, reason: cfg.reasons && cfg.reasons.length ? cfg.reasons[0] : '', feed: [], offense: null, offenses: SCAN.offenses, photo: '', kind: cfg.kind };
    var p = page();
    p.innerHTML =
      hero({ i: cfg.icon, t: cfg.pill }, cfg.title, cfg.sub, null) +
      '<div class="scan-wrap"><form class="scan-box" id="scan-form" autocomplete="off"><div class="lbl"><i class="bi bi-upc-scan"></i> ยิงบาร์โค้ด หรือพิมพ์รหัสนักเรียนแล้วกด Enter / ค้นหา</div>' +
        '<div class="scan-row"><input class="scan-input" id="scan-input" inputmode="numeric" enterkeyhint="search" autocomplete="off" maxlength="5" pattern="[0-9]*" placeholder="รหัส 5 หลัก เช่น 30001"><button type="submit" class="scan-go" aria-label="ค้นหา"><i class="bi bi-search"></i></button></div></form>' +
        '<div class="stu-preview" id="scan-preview"></div>' +
        '<div class="scan-feed" id="scan-feed"></div></div>';
    var inp = $('#scan-input'), frm = $('#scan-form'), autoT = null;
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 100);
    function go() {
      if (autoT) { clearTimeout(autoT); autoT = null; }
      var v = inp.value.trim(); if (!v) return;
      if (!/^\d{5}$/.test(v)) { toast('กรุณากรอกรหัสนักเรียนให้ครบ 5 หลัก', 'warning'); return; }   // ★ ล็อก 5 หลัก
      doLookup(v, cfg);
    }
    frm.addEventListener('submit', function (e) { e.preventDefault(); go(); });                 // ★ มือถือ: ปุ่ม "ค้นหา/Go" ยิง submit เสมอ
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } });
    inp.addEventListener('input', function () {                                                 // ★ auto-lookup เมื่อครบ 5 หลักพอดี (กัน Enter บนมือถือไม่ทำงาน + รองรับบาร์โค้ด)
      if (autoT) clearTimeout(autoT);
      var v = inp.value.replace(/\D/g, '').slice(0, 5); if (v !== inp.value) inp.value = v;
      if (v.length === 5) autoT = setTimeout(go, 250);
    });
    renderFeed();
  }
  function doLookup(id, cfg) {
    if (!id) return;
    var inp = $('#scan-input'); if (inp) inp.value = '';
    Spinner.show('กำลังค้นหานักเรียน…');
    call('student.lookup', { id: id }).then(function (d) {
      Spinner.hide(); if (!page()) return;
      SCAN.student = d.student; SCAN.reason = cfg.reasons && cfg.reasons.length ? cfg.reasons[0] : '';
      SCAN.photo = ''; SCAN.offense = null;
      renderPreview(d, cfg);
    }).catch(function (e) { Spinner.hide(); toast(e.message, 'error'); var pv = $('#scan-preview'); if (pv) pv.classList.remove('show'); try { $('#scan-input').focus(); } catch (x) {} });
  }
  function previewHead(d) {
    var s = d.student;
    return '<div class="sp-head"><div class="av">' + esc(fmt.initials(s.name)) + '</div><div style="flex:1"><div class="nm">' + esc(s.name) + '</div><div class="meta">ม.' + esc(s.class_level) + '/' + esc(s.room) + ' เลขที่ ' + esc(s.number) + ' · รหัส ' + esc(s.id) + '</div></div>' + A.alertBadge(d.alert) + '</div>' +
      '<div class="sp-stats"><div class="sp-stat"><div class="v" style="color:' + A.scoreColor(s.score) + '">' + s.score + '</div><div class="l">คะแนนความประพฤติสะสม</div></div>' +
      '<div class="sp-stat"><div class="v" style="color:' + A.lateColor(s.late_score || 0) + '">' + (s.late_score || 0) + '</div><div class="l">คะแนนมาสายสะสม</div></div>' +
      '<div class="sp-stat"><div class="v">' + (d.late ? d.late.count : 0) + '</div><div class="l">มาสายภาคเรียนนี้</div></div>' +
      '<div class="sp-stat"><div class="v">' + d.leave_today + '</div><div class="l">ลากลับวันนี้</div></div></div>';
  }
  function renderPreview(d, cfg) {
    var pv = $('#scan-preview'); if (!pv) return;
    pv.innerHTML = previewHead(d) + '<div class="sp-body">' + cfg.body(d) + '</div>';
    pv.classList.add('show');
    cfg.wire(pv, d);
    pv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function renderFeed() {
    var f = $('#scan-feed'); if (!f) return;
    if (!SCAN.feed.length) { f.innerHTML = ''; return; }
    f.innerHTML = '<div class="sf-title"><i class="bi bi-check2-all"></i> บันทึกล่าสุด (' + SCAN.feed.length + ')</div>' +
      SCAN.feed.slice(0, 15).map(function (r) { return '<div class="sf-item"><i class="bi bi-check-circle-fill ok"></i><span class="nm">' + esc(r.name) + '</span><span>' + esc(r.info) + '</span><span class="tm">' + esc(r.time) + '</span></div>'; }).join('');
  }
  function afterSave(name, info) {
    SCAN.feed.unshift({ name: name, info: info, time: TH.time(new Date()) });
    renderFeed();
    if (A.refreshNavBadges) A.refreshNavBadges();
    var pv = $('#scan-preview'); if (pv) pv.classList.remove('show');
    SCAN.student = null; SCAN.photo = '';
    var inp = $('#scan-input'); if (inp) { inp.value = ''; try { inp.focus(); } catch (e) {} }
  }
  function isOtherReason(r) { return /อื่น/.test(String(r || '')); }
  function reasonGrid(reasons, sel) {
    return '<div class="reason-grid">' + reasons.map(function (r) { return '<button type="button" class="reason-btn' + (r === sel ? ' on' : '') + '" data-reason="' + esc(r) + '">' + esc(r) + '</button>'; }).join('') + '</div>' +
      '<div class="field reason-other" id="rs-other" hidden style="margin-top:10px"><label>ระบุรายละเอียดเพิ่มเติม <span class="req">*</span></label>' +
      '<input class="input" id="rs-detail" maxlength="200" placeholder="พิมพ์รายละเอียดของ &quot;อื่นๆ&quot;"></div>';
  }
  function wireReasons(pv) {
    $$('.reason-btn', pv).forEach(function (b) {
      b.addEventListener('click', function () {
        $$('.reason-btn', pv).forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on'); SCAN.reason = b.getAttribute('data-reason'); toggleOther(pv);
      });
    });
    toggleOther(pv);
  }
  function toggleOther(pv) {
    var w = $('#rs-other', pv); if (!w) return;
    var on = isOtherReason(SCAN.reason);
    w.hidden = !on;
    if (on) { var d = $('#rs-detail', pv); if (d) setTimeout(function () { try { d.focus(); } catch (e) {} }, 60); }
  }
  // เหตุผลที่จะบันทึก — ถ้าเลือก "อื่นๆ" ต้องพิมพ์รายละเอียด (คืน null = ยังไม่ผ่าน)
  function scanReason(pv) {
    var r = SCAN.reason || 'ไม่ระบุ';
    if (!isOtherReason(r)) return r;
    var d = $('#rs-detail', pv), v = d ? d.value.trim() : '';
    if (!v) { toast('กรุณาพิมพ์รายละเอียดของ "' + r + '"', 'warning'); if (d) try { d.focus(); } catch (e) {} return null; }
    return r + ': ' + v;
  }

  // ── SCAN: LATE ──
  A.route('#/scan/late', function () {
    var reasons = listSetting('late_reasons');
    scanShell({
      kind: 'late', icon: 'clock-history', pill: 'บันทึกการมาสาย', title: 'บันทึกมาสาย', sub: 'ยิงบาร์โค้ดหรือพิมพ์รหัสนักเรียน · ระบบบันทึกเวลาและผู้บันทึกอัตโนมัติ', reasons: reasons,
      body: function () {
        return '<div class="md-section"><div class="st"><i class="bi bi-list-check"></i> เลือกสาเหตุที่มาสาย</div>' + reasonGrid(reasons, SCAN.reason) + '</div>' +
          '<div class="grid-2" style="gap:12px"><div class="field"><label>เวลาที่มาถึง <span class="req">*</span></label><input class="input" type="time" id="late-arrive" value="' + esc(TH.time(new Date()).slice(0, 5)) + '"></div>' +
          '<div class="field"><label>หมายเหตุ (ถ้ามี)</label><input class="input" id="late-note" placeholder="รายละเอียดเพิ่มเติม"></div></div>' +
          lateRuleHint(d) +
          '<button class="btn btn-primary btn-block btn-lg" id="late-save"><i class="bi bi-check2-circle"></i> บันทึกการมาสาย</button>';
      },
      wire: function (pv, d) {
        wireReasons(pv);
        $('#late-save', pv).addEventListener('click', function (ev) {
          var note = $('#late-note', pv).value, rs = scanReason(pv), at = $('#late-arrive', pv).value;
          if (rs === null) return;
          if (!/^\d{2}:\d{2}$/.test(at)) { toast('กรุณาระบุเวลาที่มาถึง', 'warning'); return; }
          A.runBtn(ev.currentTarget, function () { return saveLate(d.student.id, rs, note, at); }, { loading: 'กำลังบันทึก…', success: 'บันทึกแล้ว' }).catch(function () {});
        });
      }
    });
  });
  // กล่องบอกกติกา: ครั้งที่ผ่านมาในภาคเรียน + ครั้งถัดไปหักเท่าไร (คำนวณจาก server)
  function lateRuleHint(d) {
    var L = d.late || { count: 0, counted: 0, next_deduct: 0, cutoff: '08:35' };
    return '<div class="field-hint" style="margin-bottom:10px"><i class="bi bi-info-circle"></i> ภาคเรียนนี้มาสาย ' + L.count + ' ครั้ง (หลัง ' + esc(L.cutoff) + ' น. ' + L.counted + ' ครั้ง) · ' +
      'ถ้ามาถึงหลัง ' + esc(L.cutoff) + ' น. ครั้งนี้จะเป็นครั้งที่ ' + (L.counted + 1) + (L.next_deduct > 0 ? ' หัก <b>' + L.next_deduct + '</b> คะแนน' : ' ยังไม่หักคะแนน') + '</div>';
  }
  function saveLate(sid, reason, note, arrive) {
    return call('late.save', { student_id: sid, reason: reason, note: note, arrive_time: arrive }).then(function (r) {
      var L = r.late || {};
      var extra = L.deduct > 0 ? ' · หักคะแนนมาสาย ' + L.deduct + ' (สะสม ' + L.score + ')' : (L.counted_this ? ' · ครั้งที่ ' + L.rank + ' ยังไม่หัก' : ' · ก่อนเวลาตัด ไม่นับหัก');
      toast('บันทึกมาสาย: ' + r.student_name + extra, L.deduct > 0 ? 'warning' : 'success', 4000);
      afterSave(r.student_name, 'มาสาย · ' + reason + (L.deduct > 0 ? ' · -' + L.deduct : ''));
    });
  }

  // ── SCAN: LEAVE ──
  A.route('#/scan/leave', function () {
    var reasons = listSetting('leave_reasons'), relations = listSetting('relations');
    scanShell({
      kind: 'leave', icon: 'house-heart', pill: 'ขออนุญาตกลับบ้าน', title: 'ขออนุญาตกลับบ้าน', sub: 'บันทึกการลากลับ · ข้อมูลผู้ปกครองที่มารับ · ถ่ายรูปหลักฐาน', reasons: reasons,
      body: function () {
        return '<div class="md-section"><div class="st"><i class="bi bi-clipboard-heart"></i> สาเหตุการกลับบ้าน</div>' + reasonGrid(reasons, SCAN.reason) + '</div>' +
          '<div class="grid-2" style="gap:12px"><div class="field"><label>ชื่อผู้ปกครองที่มารับ <span class="req">*</span></label><input class="input" id="lv-gname" placeholder="ชื่อ-สกุล"></div>' +
          '<div class="field"><label>เบอร์โทรศัพท์</label><input class="input" id="lv-phone" inputmode="tel" placeholder="08x-xxx-xxxx"></div></div>' +
          '<div class="field"><label>ความสัมพันธ์</label><select class="select" id="lv-rel">' + relations.map(function (r) { return '<option>' + esc(r) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label>รูปผู้ที่มารับ</label><div id="lv-cam"></div></div>' +
          '<button class="btn btn-primary btn-block btn-lg" id="lv-save"><i class="bi bi-check2-circle"></i> บันทึกการลากลับ</button>';
      },
      wire: function (pv, d) {
        wireReasons(pv);
        renderCamBox(pv);
        $('#lv-save', pv).addEventListener('click', function (ev) {
          var gname = $('#lv-gname', pv).value.trim();
          if (!gname) { toast('กรุณากรอกชื่อผู้ปกครองที่มารับ', 'warning'); return; }
          var rs = scanReason(pv); if (rs === null) return;
          var payload = { student_id: d.student.id, reason: rs, guardian_name: gname, guardian_phone: $('#lv-phone', pv).value.trim(), relation: $('#lv-rel', pv).value, photo_url: SCAN.photo };
          A.runBtn(ev.currentTarget, function () {
            return call('leave.save', payload).then(function (r) { toast('บันทึกลากลับ: ' + r.student_name, 'success'); afterSave(r.student_name, 'ลากลับ · ผู้รับ ' + gname); });
          }, { loading: 'กำลังบันทึก…', success: 'บันทึกแล้ว' }).catch(function () {});
        });
      }
    });
  });
  // อัปโหลดรูป (จากกล้องหรือไฟล์) → Drive → เก็บลิงก์ lh3 ใน SCAN.photo
  function uploadPhoto(dataUrl, pv) {
    Spinner.show('กำลังอัปโหลดรูป…');
    var st = SCAN.student, fn = A.today().replace(/-/g, '') + '_' + TH.time(new Date()).replace(/[: น.]/g, '') + '_' + (st ? st.id : '');
    return call('file.upload', { data: dataUrl, name: fn, folder: 'หลักฐานลากลับ' }).then(function (r) {
      Spinner.hide(); SCAN.photo = r.url;
      var box = $('#lv-cam', pv); if (!box) return;
      box.innerHTML = '<div class="cam-preview"><img src="' + esc(dataUrl) + '" alt="รูปผู้มารับ"><button type="button" class="rm" id="lv-rm" aria-label="ลบรูป"><i class="bi bi-x-lg"></i></button></div>';
      $('#lv-rm', pv).addEventListener('click', function () { SCAN.photo = ''; renderCamBox(pv); });
    }).catch(function (e) { Spinner.hide(); toast('อัปโหลดรูปไม่สำเร็จ: ' + e.message, 'error'); });
  }
  // กล่องรูป: ถ่ายด้วยกล้อง (มือถือ/webcam คอม) หรือเลือกไฟล์ในเครื่อง
  function renderCamBox(pv) {
    var box = $('#lv-cam', pv); if (!box) return;
    box.innerHTML = '<div class="cam-choose">' +
      (A.hasCamera() ? '<button type="button" class="cam-box" id="lv-shot"><i class="bi bi-camera-fill"></i><div class="t">ถ่ายด้วยกล้อง</div><div class="s">กล้องมือถือ หรือ webcam</div></button>' : '') +
      '<button type="button" class="cam-box alt" id="lv-pick"><i class="bi bi-image"></i><div class="t">เลือกรูปในเครื่อง</div><div class="s">JPG / PNG</div></button>' +
      '</div><input type="file" accept="image/*" id="lv-file" hidden>';
    var fileInp = $('#lv-file', pv), shot = $('#lv-shot', pv);
    if (shot) shot.addEventListener('click', function () {
      A.openCamera({ title: 'ถ่ายรูปผู้มารับ' })
        .then(function (data) { uploadPhoto(data, pv); })
        .catch(function (e) { if (e && e.message && !/ยกเลิก/.test(e.message)) toast(e.message, 'warning', 4500); });
    });
    $('#lv-pick', pv).addEventListener('click', function () { fileInp.click(); });
    fileInp.addEventListener('change', function () {
      if (!(fileInp.files && fileInp.files[0])) return;
      Spinner.show('กำลังเตรียมรูป…');
      A.fileToPhoto(fileInp.files[0]).then(function (data) { Spinner.hide(); uploadPhoto(data, pv); })
        .catch(function (e) { Spinner.hide(); toast(e.message, 'error'); });
      fileInp.value = '';
    });
  }

  // ── SCAN: BEHAVIOR ──
  A.route('#/scan/behavior', function () {
    var p = page(); p.innerHTML = loadingPage();
    call('offense.list', {}).then(function (d) {
      SCAN.offenses = d.items;
      var offs = d.items;
      scanShell({
        kind: 'behavior', icon: 'star', pill: 'หักคะแนนความประพฤติ', title: 'หักคะแนนความประพฤติ', sub: 'เลือกฐานความผิด · คะแนนสะสมเพิ่มอัตโนมัติ · ทำความดีลดยอดสะสมได้', reasons: [],
        body: function () {
          return '<div class="seg" style="margin-bottom:14px"><button data-bkind="deduct" class="on">➖ หักคะแนน</button><button data-bkind="add">➕ ทำความดี (ลดยอดสะสม)</button></div>' +
            '<div id="bh-deduct"><div class="md-section"><div class="st"><i class="bi bi-exclamation-diamond"></i> เลือกฐานความผิด</div>' +
            '<div class="reason-grid" id="bh-offgrid">' + offs.map(function (o) { return '<button type="button" class="reason-btn" data-off="' + esc(o.code) + '" data-pts="' + o.points + '">' + esc(o.name) + ' <b style="color:inherit">(-' + o.points + ')</b></button>'; }).join('') + '</div></div></div>' +
            '<div id="bh-add" style="display:none"><div class="field"><label>รายการความดี <span class="req">*</span></label><input class="input" id="bh-goodname" placeholder="เช่น บำเพ็ญประโยชน์ · ช่วยเหลืองาน"></div></div>' +
            '<div class="grid-2" style="gap:12px"><div class="field"><label>คะแนน <span class="req">*</span></label><input class="input" type="number" id="bh-points" min="1" placeholder="0" inputmode="numeric"></div>' +
            '<div class="field"><label>รายละเอียดเหตุการณ์</label><input class="input" id="bh-detail" placeholder="อธิบายเพิ่มเติม"></div></div>' +
            '<button class="btn btn-primary btn-block btn-lg" id="bh-save"><i class="bi bi-check2-circle"></i> บันทึก</button>';
        },
        wire: function (pv, d) {
          var kind = 'deduct';
          $$('[data-bkind]', pv).forEach(function (b) { b.addEventListener('click', function () { $$('[data-bkind]', pv).forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); kind = b.getAttribute('data-bkind'); $('#bh-deduct', pv).style.display = kind === 'deduct' ? '' : 'none'; $('#bh-add', pv).style.display = kind === 'add' ? '' : 'none'; }); });
          $$('.reason-btn', $('#bh-offgrid', pv)).forEach(function (b) { b.addEventListener('click', function () { $$('.reason-btn', $('#bh-offgrid', pv)).forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); SCAN.offense = b.getAttribute('data-off'); $('#bh-points', pv).value = b.getAttribute('data-pts'); }); });
          $('#bh-save', pv).addEventListener('click', function (ev) {
            var pts = Number($('#bh-points', pv).value) || 0;
            if (pts <= 0) { toast('กรุณาระบุคะแนน', 'warning'); return; }
            var payload = { student_id: d.student.id, kind: kind, points: pts, points_override: true, detail: $('#bh-detail', pv).value };
            if (kind === 'deduct') { if (!SCAN.offense) { toast('กรุณาเลือกฐานความผิด', 'warning'); return; } payload.offense_code = SCAN.offense; }
            else { var gn = $('#bh-goodname', pv).value.trim(); if (!gn) { toast('กรุณากรอกรายการความดี', 'warning'); return; } payload.offense_name = gn; }
            A.runBtn(ev.currentTarget, function () {
              return call('behavior.save', payload).then(function (r) {
                toast((kind === 'add' ? 'ลดคะแนนสะสม (ทำความดี)' : 'หักคะแนน') + ': ' + r.student_name + ' (สะสม ' + r.score_after + ')', 'success');
                if (r.alert && r.alert.level > 0) setTimeout(function () { Swal.fire({ icon: 'warning', title: 'คะแนนสะสมถึงเกณฑ์ ' + r.alert.at, html: '<div style="font-size:34px;font-weight:800;color:#dc2626;font-family:Kanit">' + r.score_after + ' คะแนน</div><div>' + esc(r.alert.label) + '</div>', confirmButtonColor: '#2563eb' }); }, 400);
                afterSave(r.student_name, (kind === 'add' ? '+' : '-') + pts + ' คะแนน');
              });
            }, { loading: 'กำลังบันทึก…', success: 'บันทึกแล้ว' }).catch(function () {});
          });
        }
      });
    }).catch(function (e) { if (page()) page().innerHTML = emptyBox('wifi-off', 'โหลดข้อมูลไม่สำเร็จ', e.message); });
  });

  function listSetting(key) { return String((Store.boot.settings || {})[key] || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean); }
  A.listSetting = listSetting;
})();
</script>

<script type="text/x-sam" id="sam-pages2">
(function () {
  var A = window.A, Store = A.Store;
  var $ = A.$, $$ = A.$$, esc = A.esc, call = A.call, toast = A.toast, Modal = A.Modal, Spinner = A.Spinner, TH = A.TH, hasCap = A.hasCap, fmt = A.fmt, hero = A.hero, emptyBox = A.emptyBox, listSetting = A.listSetting;
  function page() { return document.getElementById('page'); }
  function qp(hash, k) { var m = (hash || location.hash).split('?')[1]; if (!m) return ''; var r = ''; m.split('&').forEach(function (kv) { var p = kv.split('='); if (decodeURIComponent(p[0]) === k) r = decodeURIComponent(p[1] || ''); }); return r; }

  // ═══ STUDENTS ═══
  var STU = { page: 1, q: '', cls: '', room: '', status: 'active', sort: 'class', view: 'grid', rooms: [], classes: [] };
  function renderStudents() {
    var p = page();
    var canEdit = hasCap('student.manage');
    p.innerHTML = hero({ i: 'people-fill', t: 'ข้อมูลนักเรียน' }, 'ข้อมูลนักเรียน', 'ค้นหา · จัดการ · ดูคะแนนความประพฤติรายบุคคล', null) +
      '<div class="panel"><div class="toolbar">' +
        '<div class="search-box"><i class="bi bi-search"></i><input class="input" id="stu-q" placeholder="ค้นหาชื่อ / รหัส / ครูที่ปรึกษา" value="' + esc(STU.q) + '"></div>' +
        '<select class="select" id="stu-cls" style="max-width:130px"><option value="">ทุกชั้น</option></select>' +
        '<select class="select" id="stu-room" style="max-width:120px"><option value="">ทุกห้อง</option></select>' +
        '<select class="select" id="stu-status" style="max-width:150px"><option value="active">กำลังศึกษา</option><option value="">ทั้งหมด</option><option value="left">จำหน่ายออก</option></select>' +
        '<select class="select" id="stu-sort" style="max-width:130px"><option value="class">เรียงตามชั้น</option><option value="score">คะแนนสะสมมากสุด</option><option value="name">ชื่อ</option></select>' +
        '<div class="seg"><button data-view="grid" class="on"><i class="bi bi-grid-3x3-gap"></i></button><button data-view="table"><i class="bi bi-list-ul"></i></button></div>' +
        (canEdit ? '<button class="btn btn-soft" id="stu-import"><i class="bi bi-file-earmark-excel"></i> นำเข้า Excel</button><button class="btn btn-primary" id="stu-add"><i class="bi bi-plus-lg"></i> เพิ่มนักเรียน</button>' : '') +
      '</div><div id="stu-list">' + skel() + '</div></div>';
    ['stu-status', 'stu-sort'].forEach(function (id) { $('#' + id).value = id === 'stu-status' ? STU.status : STU.sort; });
    var q = $('#stu-q'); var timer;
    q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { STU.q = q.value; STU.page = 1; loadStudents(); }, 300); });
    $('#stu-cls').addEventListener('change', function () { STU.cls = this.value; STU.room = ''; STU.page = 1; fillRooms(); loadStudents(); });
    $('#stu-room').addEventListener('change', function () { STU.room = this.value; STU.page = 1; loadStudents(); });
    $('#stu-status').addEventListener('change', function () { STU.status = this.value; STU.page = 1; loadStudents(); });
    $('#stu-sort').addEventListener('change', function () { STU.sort = this.value; STU.page = 1; loadStudents(); });
    $$('[data-view]').forEach(function (b) { b.addEventListener('click', function () { $$('[data-view]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); STU.view = b.getAttribute('data-view'); loadStudents(); }); });
    if (canEdit) { $('#stu-add').addEventListener('click', function () { openStudentModal(null); }); $('#stu-import').addEventListener('click', openImportModal); }
    call('student.classrooms', {}).then(function (d) { STU.classes = d.classes; STU.rooms = d.rooms; fillClasses(); fillRooms(); });
    loadStudents();
  }
  function fillClasses() { var s = $('#stu-cls'); if (!s) return; s.innerHTML = '<option value="">ทุกชั้น</option>' + STU.classes.map(function (c) { return '<option value="' + esc(c) + '"' + (c === STU.cls ? ' selected' : '') + '>ม.' + esc(c) + '</option>'; }).join(''); }
  function fillRooms() { var s = $('#stu-room'); if (!s) return; var rs = STU.rooms.filter(function (r) { return !STU.cls || r.class_level === STU.cls; }); s.innerHTML = '<option value="">ทุกห้อง</option>' + rs.map(function (r) { return '<option value="' + esc(r.room) + '"' + (r.room === STU.room && r.class_level === STU.cls ? ' selected' : '') + '>ม.' + esc(r.class_level) + '/' + esc(r.room) + '</option>'; }).join(''); }
  function skel() { return '<div class="stu-grid">' + '<div class="skel" style="height:130px"></div>'.repeat(6) + '</div>'; }
  function loadStudents() {
    var host = $('#stu-list'); if (!host) return; host.innerHTML = skel();

  // ── import wizard ──
  function openImportModal() {
    var rows = [];
    Modal.open({
      title: 'นำเข้าข้อมูลนักเรียน', icon: 'file-earmark-excel', large: true,
      html: '<div id="imp-step1"><div class="drop-zone" id="imp-drop"><i class="bi bi-cloud-arrow-up"></i><div class="t">เลือกไฟล์ Excel (.xlsx) หรือ CSV</div><div class="s">คอลัมน์: รหัส, คำนำหน้า, ชื่อ, นามสกุล, ชั้น, ห้อง, เลขที่, ครูที่ปรึกษา</div></div>' +
        '<input type="file" accept=".xlsx,.xls,.csv" id="imp-file" hidden>' +
        '<div style="margin-top:12px;text-align:center"><button class="btn btn-ghost btn-sm" id="imp-tmpl"><i class="bi bi-download"></i> ดาวน์โหลดแม่แบบ CSV</button></div></div>' +
        '<div id="imp-step2" style="display:none"></div>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">ปิด</button><button class="btn btn-primary" id="imp-run" style="display:none"><i class="bi bi-check-lg"></i> นำเข้าข้อมูล</button>',
      onOpen: function (card) {
        var fileInp = $('#imp-file', card), drop = $('#imp-drop', card);
        drop.addEventListener('click', function () { fileInp.click(); });
        drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('drag'); });
        drop.addEventListener('dragleave', function () { drop.classList.remove('drag'); });
        drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('drag'); if (e.dataTransfer.files[0]) parseFile(e.dataTransfer.files[0], card); });
        fileInp.addEventListener('change', function () { if (fileInp.files[0]) parseFile(fileInp.files[0], card); });
        $('#imp-tmpl', card).addEventListener('click', function () {
          var csv = '﻿รหัส,คำนำหน้า,ชื่อ,นามสกุล,ชั้น,ห้อง,เลขที่,ครูที่ปรึกษา\n30001,เด็กชาย,สมชาย,ใจดี,1,1,1,ครูสมศรี\n';
          var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'แม่แบบนักเรียน.csv'; a.click();
        });
      }
    });
    function parseFile(file, card) {
      var name = file.name.toLowerCase();
      if (/\.csv$/.test(name)) { var rd = new FileReader(); rd.onload = function () { showPreview(parseCsv(rd.result), card); }; rd.readAsText(file, 'UTF-8'); }
      else { loadXlsx().then(function (XLSX) { var rd = new FileReader(); rd.onload = function () { var wb = XLSX.read(new Uint8Array(rd.result), { type: 'array' }); var arr = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 }); showPreview(arr, card); }; rd.readAsArrayBuffer(file); }).catch(function (e) { toast('โหลดตัวอ่าน Excel ไม่สำเร็จ: ' + e.message, 'error'); }); }
    }
    function parseCsv(txt) { return txt.replace(/^﻿/, '').split(/\r?\n/).filter(Boolean).map(function (l) { return l.split(','); }); }
    function showPreview(arr, card) {
      if (!arr || arr.length < 2) { toast('ไฟล์ว่างหรือรูปแบบไม่ถูกต้อง', 'warning'); return; }
      var head = arr[0].map(function (x) { return String(x || '').trim(); });
      var idx = mapCols(head);
      rows = arr.slice(1).map(function (r) { return { id: cell(r, idx.id), prefix: cell(r, idx.prefix), first_name: cell(r, idx.first), last_name: cell(r, idx.last), class_level: cell(r, idx.cls), room: cell(r, idx.room), number: cell(r, idx.no), advisor_name: cell(r, idx.adv) }; }).filter(function (r) { return r.id; });
      $('#imp-step1', card).style.display = 'none';
      var s2 = $('#imp-step2', card); s2.style.display = 'block';
      s2.innerHTML = '<div class="imp-stat"><span class="imp-badge b-ok"><i class="bi bi-check-circle"></i> พบ ' + rows.length + ' รายการ</span></div>' +
        '<div class="imp-preview"><table class="data-table"><thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>ชั้น/ห้อง</th></tr></thead><tbody>' +
        rows.slice(0, 8).map(function (r) { return '<tr><td>' + esc(r.id) + '</td><td>' + esc((r.prefix || '') + r.first_name + ' ' + r.last_name) + '</td><td>ม.' + esc(r.class_level) + '/' + esc(r.room) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
        (rows.length > 8 ? '<div class="field-hint" style="text-align:center;margin-top:8px">และอีก ' + (rows.length - 8) + ' รายการ</div>' : '');
      var runBtn = $('#imp-run'); runBtn.style.display = 'inline-flex';
      runBtn.onclick = function (ev) { A.runBtn(ev.currentTarget, function () { return call('student.import', { rows: rows }).then(function (r) { toast('นำเข้าสำเร็จ: เพิ่ม ' + r.created + ' · อัปเดต ' + r.updated + ' · ข้าม ' + r.skipped, 'success', 5000); Modal.close(); loadStudents(); }); }, { loading: 'กำลังนำเข้า…' }).catch(function () {}); };
    }
    function mapCols(head) { function find(keys) { for (var i = 0; i < head.length; i++) { var h = head[i].toLowerCase(); if (keys.some(function (k) { return h.indexOf(k) >= 0; })) return i; } return -1; } return { id: find(['รหัส', 'id', 'code']), prefix: find(['คำนำหน้า', 'prefix']), first: find(['ชื่อ', 'first']), last: find(['นามสกุล', 'สกุล', 'last']), cls: find(['ชั้น', 'class', 'level']), room: find(['ห้อง', 'room']), no: find(['เลขที่', 'number', 'no']), adv: find(['ปรึกษา', 'advisor']) }; }
    function cell(r, i) { return i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : ''; }
  }
  var _xlsx = null;
  function loadXlsx() {
    if (_xlsx) return Promise.resolve(_xlsx);
    if (window.XLSX) { _xlsx = window.XLSX; return Promise.resolve(_xlsx); }
    var cdns = ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
    return new Promise(function (resolve, reject) {
      function tryLoad(i) { if (window.XLSX) { _xlsx = window.XLSX; return resolve(_xlsx); } if (i >= cdns.length) return reject(new Error('โหลดไม่สำเร็จ')); var s = document.createElement('script'); s.src = cdns[i]; s.onload = function () { if (window.XLSX) { _xlsx = window.XLSX; resolve(_xlsx); } else tryLoad(i + 1); }; s.onerror = function () { tryLoad(i + 1); }; document.head.appendChild(s); }
      tryLoad(0);
    });
  }
