<style>
:root{
  --blue:#2563eb;--blue2:#0ea5e9;--blue3:#38bdf8;
  --grad:linear-gradient(135deg,var(--blue),var(--blue2));
  --ink:#0f172a;--ink2:#475569;--muted:#94a3b8;--line:#e6ecf5;--line2:#eef2f8;
  --bg:#eef3fb;--surface:#ffffff;--glass:rgba(255,255,255,.72);
  --ok:#10b981;--warn:#f59e0b;--danger:#ef4444;--info:#0ea5e9;--gold:#f59e0b;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow:0 12px 30px rgba(15,23,42,.10);--shadow-lg:0 24px 60px rgba(15,23,42,.16);
  --r:16px;--r-lg:22px;
}
:root[data-theme="emerald"]{--blue:#059669;--blue2:#10b981;--blue3:#34d399;}
:root[data-theme="violet"]{--blue:#7c3aed;--blue2:#a78bfa;--blue3:#c4b5fd;}
:root[data-theme="rose"]{--blue:#e11d48;--blue2:#fb7185;--blue3:#fda4af;}
:root[data-theme="amber"]{--blue:#d97706;--blue2:#f59e0b;--blue3:#fbbf24;}
:root[data-theme="slate"]{--blue:#334155;--blue2:#64748b;--blue3:#94a3b8;}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:'Sarabun','Kanit',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 10% -10%,rgba(37,99,235,.10),transparent 60%),
             radial-gradient(1000px 500px at 110% 10%,rgba(14,165,233,.10),transparent 55%),var(--bg);
  -webkit-font-smoothing:antialiased;font-size:14.5px;line-height:1.5;overflow-x:hidden;max-width:100%}
h1,h2,h3,h4,.font-display{font-family:'Kanit','Sarabun',sans-serif}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;border:2px solid transparent;background-clip:padding-box}

/* ── boot loader ── */
.boot-loader{position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(900px 500px at 50% 20%,rgba(37,99,235,.12),transparent),#f4f8ff}
.boot-ring{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:34px}
.boot-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(37,99,235,.16);border-top-color:var(--blue);animation:spin 1s linear infinite}
.boot-brand{font-family:'Kanit';font-weight:800;font-size:19px;color:var(--ink)}
.boot-text{font-size:13px;color:var(--ink2)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;transition:.16s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);border-color:#cbd5e1}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--grad);color:#fff;border:0;box-shadow:0 8px 18px rgba(37,99,235,.28)}
.btn-primary:hover{box-shadow:0 12px 24px rgba(37,99,235,.36)}
.btn-ghost{background:#fff}
.btn-soft{background:color-mix(in srgb,var(--blue) 10%,#fff);border-color:transparent;color:var(--blue)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border:0}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:0}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn-lg{padding:13px 22px;font-size:15px}
.btn-block{width:100%}
.btn-icon{padding:8px;width:38px;height:38px}
.btn[data-state]{pointer-events:none}
.btn[data-state="success"]{background:linear-gradient(135deg,#10b981,#059669)!important;color:#fff!important;border:0}
.btn[data-state="error"]{background:linear-gradient(135deg,#ef4444,#dc2626)!important;color:#fff!important;border:0}
.spin-inline{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn-ghost .spin-inline,.btn .spin-inline{border-color:rgba(37,99,235,.3);border-top-color:var(--blue)}

/* ── forms ── */
.field{margin-bottom:14px}
/* ★ ต้อง :not(.switch) — ไม่งั้น .field label (0,1,1) ทับ .switch{display:inline-flex} (0,1,0) → สวิตช์ทับตัวอักษร */
.field label:not(.switch){display:block;font-weight:600;font-size:13px;color:var(--ink2);margin-bottom:6px}
.req{color:var(--danger);margin-left:2px}
.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:14.5px;color:var(--ink);background:#fff;transition:.15s;min-width:0}
.input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.textarea{resize:vertical;min-height:78px}
.field-hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.field.has-error .input,.field.has-error .select,.field.has-error .textarea{border-color:var(--danger);background:#fef2f2}
.field-error{margin-top:5px;font-size:12px;color:#dc2626;display:flex;gap:5px;align-items:center}
.input-wrap{position:relative}
.input-wrap .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.input-wrap .input{padding-left:38px}

/* ── switch ── */
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-weight:500;font-size:13.5px}
.switch input{display:none}
.switch .track{width:42px;height:24px;border-radius:99px;background:#cbd5e1;position:relative;transition:.2s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+.track{background:var(--blue)}
.switch input:checked+.track::after{left:20px}

/* ── badges / chips ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;line-height:1.5}
.b-ok{background:#ecfdf5;color:#047857}.b-warn{background:#fffbeb;color:#b45309}
.b-danger{background:#fef2f2;color:#b91c1c}.b-info{background:#eff6ff;color:#1d4ed8}.b-muted{background:#f1f5f9;color:#64748b}
.b-auto{background:#f5f3ff;color:#6d28d9}
.role-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:700}
.role-chip i{font-size:12px}
.role-chip-admin{background:linear-gradient(135deg,#fde68a,#fbbf24);color:#78350f}
.role-chip-teacher{background:linear-gradient(135deg,#a7f3d0,#34d399);color:#065f46}
.role-chip-advisor{background:linear-gradient(135deg,#bfdbfe,#60a5fa);color:#1e3a8a}
.role-chip-director{background:linear-gradient(135deg,#ddd6fe,#a78bfa);color:#4c1d95}

/* ── shell ── */
.shell{display:flex;align-items:stretch;min-height:100vh;width:100%}
.sidebar{flex:0 0 262px;width:262px;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,#0f2547,#132f5c);color:#dbe6fb;display:flex;flex-direction:column;z-index:60}
.sb-head{padding:20px 18px 14px}
.sb-logo{display:flex;gap:11px;align-items:center}
.sb-logo .lg{width:42px;height:42px;border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 6px 16px rgba(37,99,235,.4)}
.sb-logo .tx{line-height:1.25}.sb-logo .tx b{font-family:'Kanit';font-size:15px;color:#fff}.sb-logo .tx span{font-size:11px;color:#93b4e8}
.sb-clock{margin-top:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:11px 13px;text-align:center}
.sb-clock .t{font-family:'Kanit';font-weight:700;font-size:22px;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(56,189,248,.5)}
.sb-clock .d{font-size:11.5px;color:#a9c4ef;margin-top:2px}
.sb-user{margin:10px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:11px;display:flex;gap:10px;align-items:center}
.sb-user .av{width:38px;height:38px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Kanit'}
.sb-user .nm{line-height:1.3;min-width:0}.sb-user .nm b{font-size:13px;color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;padding:6px 12px 18px;overflow-y:auto}
.sb-cat{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#7e9fd4;font-weight:700;padding:14px 10px 6px;display:flex;align-items:center;gap:6px}
.sb-cat::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--blue3);box-shadow:0 0 6px var(--blue3)}
.sb-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:#c5d6f2;font-weight:500;font-size:13.5px;position:relative;margin-bottom:2px;cursor:pointer}
.sb-link i{font-size:17px;width:20px;text-align:center}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-link.active{background:linear-gradient(90deg,rgba(56,189,248,.22),rgba(56,189,248,.04));color:#fff}
.sb-tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-badge{margin-left:auto;flex:0 0 auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff;font-size:11px;font-weight:800;font-family:'Kanit';display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(14,165,233,.4)}
.sb-badge[hidden]{display:none}
.sb-link.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--blue3);box-shadow:0 0 8px var(--blue3)}
.sb-link.is-logout{color:#fca5a5}.sb-link.is-logout:hover{background:rgba(239,68,68,.14);color:#fecaca}
.sb-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px}

.main-area{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.navbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 20px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line)}
.nav-burger{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:18px;color:var(--ink);cursor:pointer}
.nav-page{display:flex;align-items:center;gap:12px;min-width:0}
.nav-page .pi{width:42px;height:42px;flex:none;border-radius:13px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.nav-page .tx{line-height:1.25;min-width:0}.nav-page .tx b{font-family:'Kanit';font-size:17px;display:block}.nav-page .tx span{font-size:12px;color:var(--ink2)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.nav-clock{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px}
.nav-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#047857;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:99px;padding:5px 11px;font-weight:600}
.nav-status .dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;position:relative;font-size:17px;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:#f8fafc}
.nav-dot{position:absolute;top:7px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.nav-prof{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:5px 11px 5px 5px;cursor:pointer}
.nav-prof .av{width:32px;height:32px;border-radius:9px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.nav-prof .nm{font-size:12.5px;font-weight:600;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── popover (profile / bell) ── */
.pop{display:none;position:fixed;top:60px;right:16px;z-index:120;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.pop.show{display:block;animation:popin .16s ease}
@keyframes popin{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.pop-prof{width:270px}
.pop-head{padding:16px;background:var(--grad);color:#fff}
.pop-head b{font-family:'Kanit';font-size:14px;display:block}.pop-head span{font-size:11.5px;opacity:.9;word-break:break-all}
.pop-item{display:flex;align-items:center;gap:11px;padding:11px 15px;cursor:pointer;font-size:13.5px;font-weight:500}
.pop-item i{font-size:16px;color:var(--ink2);width:18px}
.pop-item:hover{background:#f4f8ff}
.pop-item.danger{color:var(--danger)}.pop-item.danger i{color:var(--danger)}
.pop-sep{height:1px;background:var(--line);margin:4px 0}
.pop-bell{width:340px;max-height:70vh}
.pop.show.pop-bell{display:flex;flex-direction:column}
.pop-bell .bh{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.pop-bell .bh b{font-family:'Kanit';font-size:14px}
.pop-bell .bl{overflow-y:auto}
.ni{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line2);cursor:pointer}
.ni.unread{background:#f4f8ff}
.ni .ic{width:36px;height:36px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;background:var(--grad)}
.ni .tt{font-size:13px;font-weight:600;line-height:1.35}.ni .ms{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.4}.ni .tm{font-size:10.5px;color:var(--muted);margin-top:3px}

/* ── page wrap / hero / kpi ── */
.page-wrap{padding:22px;max-width:1400px;margin:0 auto;width:100%}
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);color:#fff;padding:26px 26px;margin-bottom:20px;
  background:linear-gradient(130deg,var(--blue),var(--blue2) 60%,var(--blue3));box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;top:-40%;right:-8%;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 62%);pointer-events:none}
.hero::after{content:"";position:absolute;bottom:-60%;left:20%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 60%);pointer-events:none}
.hero-in{position:relative;z-index:1}
.hero-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:5px 13px;border-radius:99px;font-size:12px;font-weight:600;margin-bottom:10px}
.hero-title{font-family:'Kanit';font-weight:800;font-size:25px;margin:0}
.hero-sub{font-size:13.5px;opacity:.92;margin-top:5px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}
.kpi{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:15px;padding:13px 15px;backdrop-filter:blur(6px)}
.kpi-ic{font-size:18px;opacity:.9}
.kpi-val{font-family:'Kanit';font-weight:800;font-size:26px;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi-lb{font-size:11.5px;opacity:.9;margin-top:3px}

/* ── cards / panels ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:18px;margin-bottom:18px}
.panel-h{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.panel-h .pt{font-family:'Kanit';font-weight:700;font-size:16px}
.panel-h .pi{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--blue) 12%,#fff);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:17px}
.panel-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ── toolbar / search / segments ── */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search-box{position:relative;flex:1;min-width:200px}
.search-box i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.search-box .input{padding-left:38px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.chip i{font-size:14px}
.seg{display:inline-flex;background:#f1f5f9;border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--blue);box-shadow:var(--shadow-sm)}

/* ── tables ── */
.data-table{width:100%;border-collapse:collapse;font-size:13.5px}
.data-table thead th{text-align:left;padding:11px 12px;background:#f8fafc;color:var(--ink2);font-weight:700;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}

/* ── avatar / student cell ── */

/* ── empty / loading ── */

/* ── modal ── */

/* ── toast ── */

.ring{width:96px;height:96px;margin:0 auto}
.ring-lb{font-size:12.5px;color:var(--ink2);margin-top:8px;font-weight:600}
.medal{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
.medal-1{background:linear-gradient(135deg,#fcd34d,#f59e0b)}.medal-2{background:linear-gradient(135deg,#e5e7eb,#9ca3af)}
.medal-3{background:linear-gradient(135deg,#fbbf24,#b45309)}.medal-n{background:#e2e8f0;color:#64748b}

/* ── scan pages ── */
.scan-wrap{max-width:760px;margin:0 auto}
.scan-box{background:#fff;border:2px solid var(--blue);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(37,99,235,.14);margin-bottom:18px;position:relative}
.scan-box .lbl{font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.scan-input{width:100%;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:26px;font-weight:700;font-family:'Kanit';text-align:center;letter-spacing:.15em;color:var(--ink)}
.scan-input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.stu-preview{display:none;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;animation:mdin .25s ease}
.stu-preview.show{display:block}
.sp-head{padding:18px 20px;background:linear-gradient(130deg,var(--blue),var(--blue2));color:#fff;display:flex;gap:14px;align-items:center}
.sp-head .av{width:60px;height:60px;border-radius:17px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-family:'Kanit';font-weight:800;font-size:24px}
.sp-head .nm{font-family:'Kanit';font-weight:800;font-size:21px}
.sp-head .meta{font-size:13px;opacity:.92;margin-top:2px}
.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.sp-stat{padding:14px;text-align:center;border-right:1px solid var(--line)}
.sp-stat:last-child{border-right:0}
.sp-stat .v{font-family:'Kanit';font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.sp-stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sp-body{padding:18px 20px}
.reason-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;margin-bottom:14px}
.reason-btn{border:1px solid var(--line);border-radius:12px;padding:11px 8px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);text-align:center;transition:.15s}
.reason-btn:hover{border-color:var(--blue);color:var(--blue)}
.reason-btn.on{background:var(--grad);color:#fff;border-color:transparent}
.scan-feed{margin-top:6px}
.sf-title{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sf-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#f8fafc;border-radius:11px;margin-bottom:6px;font-size:13px;animation:tin .3s ease}
.sf-item .ok{color:var(--ok);font-size:16px}
.sf-item .nm{font-weight:600}.sf-item .tm{margin-left:auto;font-size:11.5px;color:var(--muted)}

/* ── camera capture ── */
.cam-box{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;cursor:pointer;background:#f8fafc;transition:.15s}
.cam-box:hover{border-color:var(--blue);background:#f4f8ff}
.cam-box i{font-size:38px;color:var(--muted)}
.cam-box .t{font-size:13.5px;font-weight:600;color:var(--ink2);margin-top:8px}
.cam-box .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.cam-preview{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.cam-preview img{width:100%;display:block;max-height:280px;object-fit:cover}
.cam-preview .rm{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:9px;background:rgba(15,23,42,.6);color:#fff;cursor:pointer;font-size:15px}
.cam-choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cam-box.alt{background:#fff;border-style:solid}
.cam-box.alt i{color:var(--blue)}

/* ── กล้องในหน้าเว็บ (มือถือ + webcam คอม) ── */
.cam-modal{position:fixed;inset:0;z-index:200;background:rgba(2,6,23,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.cam-card{width:min(560px,100%);background:#0f172a;border:1px solid rgba(255,255,255,.14);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg)}
.cam-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;color:#f1f5f9;font-family:Kanit;font-weight:700;font-size:15px;border-bottom:1px solid rgba(255,255,255,.1)}
.cam-x{width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.1);color:#f1f5f9;cursor:pointer;font-size:15px}
.cam-x:hover{background:rgba(255,255,255,.2)}
.cam-view{position:relative;background:#000;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.cam-view video{width:100%;height:100%;object-fit:cover;display:block}
.cam-hint{position:absolute;color:#cbd5e1;font-size:13px;font-weight:600}
.cam-btns{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#0b1220}
.cam-btns .btn-ghost{background:rgba(255,255,255,.08);color:#e2e8f0;border-color:rgba(255,255,255,.14)}
.cam-btns .btn-ghost:hover{background:rgba(255,255,255,.16)}
.cam-shot{width:62px;height:62px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:var(--blue);color:#fff;font-size:23px;cursor:pointer;flex:none;transition:.15s}
.cam-shot:hover{transform:scale(1.05)}
.cam-shot:active{transform:scale(.94)}

/* ── student grid cards ── */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.stu-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.stu-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cbd5e1}
.stu-card .top{display:flex;gap:12px;align-items:center}
.stu-card .nm{font-family:'Kanit';font-weight:700;font-size:15px;line-height:1.3}
.stu-card .meta{font-size:12px;color:var(--muted)}
.stu-card .sc-score{margin-top:12px;display:flex;align-items:center;gap:10px}
.stu-card .sc-bar{flex:1;height:9px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.stu-card .sc-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.stu-card .sc-num{font-family:'Kanit';font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.stu-card .sc-alert{position:absolute;top:12px;right:12px}

/* ── detail modal sections ── */
.md-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.md-stat{background:#f8fafc;border-radius:13px;padding:12px;text-align:center}
.md-stat .v{font-family:'Kanit';font-weight:800;font-size:23px;font-variant-numeric:tabular-nums}
.md-stat .l{font-size:11px;color:var(--muted)}
.md-section{margin-bottom:16px}
.md-section .st{font-family:'Kanit';font-weight:700;font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:7px;color:var(--ink)}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.info-row .k{color:var(--ink2)}.info-row .v{font-weight:600}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:8px 0 8px 8px}
.tl-item::before{content:"";position:absolute;left:-19px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tl-item.deduct::before{background:var(--danger)}.tl-item.add::before{background:var(--ok)}
.tl-item .th{font-size:13.5px;font-weight:600}.tl-item .tm{font-size:11.5px;color:var(--muted)}
.pts-chip{font-family:'Kanit';font-weight:800;font-size:14px}
.pts-neg{color:var(--danger)}.pts-pos{color:var(--ok)}

/* ── offense management ── */
.off-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
.off-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm);position:relative}
.off-card.off-off{opacity:.6}
.off-card .top{display:flex;gap:11px;align-items:center}
.off-card .oi{width:44px;height:44px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.off-card .on{font-family:'Kanit';font-weight:700;font-size:14.5px;line-height:1.3}
.off-card .oc{font-size:11.5px;color:var(--muted)}
.off-card .opt{margin-top:11px;display:flex;align-items:center;gap:8px}
.off-card .opts{font-family:'Kanit';font-weight:800;font-size:20px;color:var(--danger)}
.off-card .oact{margin-left:auto;display:flex;gap:6px}
.off-card .oact button{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;color:var(--ink2);font-size:14px}
.off-card .oact button:hover{background:#f8fafc}
.off-add{border:2px dashed #cbd5e1;background:#f8fafc;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;cursor:pointer;color:var(--muted);min-height:110px}
.off-add:hover{border-color:var(--blue);color:var(--blue)}
.off-add i{font-size:28px}

/* icon / color picker */
.icon-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:150px;overflow-y:auto;padding:4px}
.icon-picker button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:17px;cursor:pointer;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.icon-picker button.on{background:var(--grad);color:#fff;border-color:transparent}
.color-picker{display:flex;flex-wrap:wrap;gap:7px}
.color-picker button{width:30px;height:30px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.color-picker button.on{box-shadow:0 0 0 2px var(--blue),0 0 0 4px #fff}

/* ── theme swatch ── */
.theme-swatch{display:flex;gap:9px;flex-wrap:wrap}
.ts-dot{width:34px;height:34px;border-radius:11px;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ts-dot.on{box-shadow:0 0 0 2px var(--blue),0 0 0 4px #fff}

/* ── import wizard ── */
.drop-zone{border:2px dashed #cbd5e1;border-radius:16px;padding:34px 20px;text-align:center;cursor:pointer;background:#f8fafc;transition:.15s}
.drop-zone.drag{border-color:var(--blue);background:#eff6ff}
.drop-zone i{font-size:44px;color:var(--blue)}
.drop-zone .t{font-family:'Kanit';font-weight:700;margin-top:10px}
.drop-zone .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.imp-preview{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.imp-stat{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.imp-badge{padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px}

/* ── print document ── */
.pr-only{display:none}
/* ★ ทุก rule ที่ซ่อนแอปต้อง scope ใต้ body.prt-on (ใส่ตอนสร้างเอกสารพิมพ์เท่านั้น)
   ถ้าเขียนแบบ global แล้วมีที่ไหนเรียก window.print() โดยไม่สร้าง .pr-only → หน้าพิมพ์จะว่างเปล่า */
@media print{
  body{background:#fff!important}
  body.prt-on #app-root, body.prt-on #modal-host, body.prt-on #spin-host, body.prt-on #boot-loader{display:none!important}
  .navbar,.sidebar,.app-footer,.bottom-nav,.sb-backdrop,.toolbar,.pager,.sd-no-print{display:none!important}
  body.prt-on .pr-only{display:block!important;position:static}
  @page{size:A4 portrait;margin:14mm 12mm}
  .pr-doc{font-family:'Sarabun',sans-serif;color:#000;max-width:100%}
  .pr-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px}
  .pr-logo{width:64px;height:64px}
  .pr-title{text-align:center;margin-bottom:14px}
  .pr-title h2{font-family:'Kanit';margin:0;font-size:20pt}
  .pr-title .sub{font-size:11pt;color:#333}
  .pr-meta{display:flex;justify-content:space-between;font-size:10pt;color:#333;border-bottom:1px solid #94a3b8;padding-bottom:6px;margin-bottom:10px}
  .pr-table{width:100%;border-collapse:collapse;font-size:10.5pt;margin-bottom:12px}
  .pr-table th{background:#1e293b;color:#fff;padding:6px 8px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-table td{border:1px solid #94a3b8;padding:5px 8px}
  .pr-table tr{page-break-inside:avoid}
  .pr-table thead{display:table-header-group}
  .pr-sum{font-size:11pt;margin:8px 0 12px}
  .pr-sign{display:flex;justify-content:space-around;margin-top:40px;page-break-inside:avoid}
  .pr-sign .s{text-align:center;font-size:10.5pt}
  .pr-sign .line{border-top:1px dotted #000;width:180px;margin:0 auto 6px}
  .pr-foot{margin-top:18px;font-size:9pt;color:#555;text-align:right}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ── mobile / responsive ── */
@media (max-width:1024px){
  .sidebar{position:fixed;left:-300px;top:0;height:100vh;transition:left .25s;flex:none;box-shadow:var(--shadow-lg)}
  .sidebar.open{left:0}
  .nav-burger{display:flex;align-items:center;justify-content:center}
  .grid-2,.grid-2c,.grid-3{grid-template-columns:1fr}
}
@media (max-width:768px){
  html,body{overflow-x:hidden}
  .page-wrap{padding:16px;padding-bottom:86px}
  .navbar{padding:10px 14px}
  .nav-clock,.nav-status{display:none}
  .nav-page .tx b{font-size:15px}.nav-page .tx span{display:none}
  .bottom-nav{display:flex}
  .app-footer{margin:12px 14px 86px;flex-direction:column-reverse;text-align:center;gap:12px}
  .af-dev .info{text-align:center}
  .hero{padding:20px 18px}.hero-title{font-size:21px}
  .lf-win{grid-template-columns:1fr;max-width:460px;min-height:auto}
  .lf-brand{display:none}
  .lf-fmini{display:flex}
  .lf-form{padding:34px 24px}
  .lf-demo-grid{grid-template-columns:repeat(2,1fr)}
  .sp-head{flex-wrap:wrap}
  .desktop-only{display:none!important}
  .mobile-only{display:block}
  .data-table thead{display:none}
  .data-table.rc tbody tr{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 12px;box-shadow:var(--shadow-sm)}
  .data-table.rc tbody td{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line2);text-align:right}
  .data-table.rc tbody td:last-child{border-bottom:0}
  .data-table.rc tbody td::before{content:attr(data-label);font-weight:600;color:var(--ink2);font-size:12px;text-align:left}
  .md-stats{grid-template-columns:1fr 1fr}
  .lm-nav{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .lm-tab{white-space:nowrap;flex:none}
  .lm-body{flex-direction:column}
  .modal-card{max-height:94vh}
}
@media (max-width:480px){
  .lf-demo-grid{grid-template-columns:repeat(2,1fr)}
  .kpi-row{grid-template-columns:1fr 1fr}
  .sp-stats{grid-template-columns:1fr}
  .lp-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── scan row (input + ปุ่มค้นหา — แก้ Enter บนมือถือ) ── */
.scan-row{display:flex;gap:10px;align-items:stretch}
.scan-row .scan-input{flex:1;min-width:0}
.scan-go{flex:0 0 58px;border:0;border-radius:14px;background:var(--grad);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.scan-go:active{transform:translateY(1px)}

/* ── Live Board (จอแยก 2 ฝั่ง) ── */
.board-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.board-col{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;min-height:60vh}
.board-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;color:#fff}
.board-h.amber{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.board-h.sky{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}
.board-h .bt{font-family:'Kanit';font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.board-h .bc{font-family:'Kanit';font-weight:800;font-size:26px;min-width:44px;text-align:center;background:rgba(255,255,255,.22);border-radius:12px;padding:2px 10px}
.board-body{flex:1;overflow-y:auto;padding:10px}
.brow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:1px solid var(--line2);margin-bottom:8px;animation:popin .2s ease}
.brow.self{border-color:#bfdbfe;background:#f5faff}
.btime{flex:0 0 52px;font-family:'Kanit';font-weight:800;font-size:16px;color:var(--blue);text-align:center}
.bmain{flex:1;min-width:0}
.bnm{font-weight:700;font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bself{font-size:10.5px;font-weight:700;color:#0369a1;background:#e0f2fe;border-radius:99px;padding:1px 8px}
.bmeta{font-size:12px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-empty{text-align:center;color:var(--muted);padding:44px 12px}
.board-empty i{font-size:40px;display:block;margin-bottom:8px;opacity:.5}
.board-foot{text-align:center;color:var(--ink2);font-size:12.5px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.board-act{display:flex;justify-content:center;margin-top:10px}
.reason-other{margin-top:10px}
@media(max-width:720px){.board-wrap{grid-template-columns:1fr}.board-col{min-height:44vh}}

/* ── login: ปุ่ม self-service สำหรับนักเรียน ── */
.lf-self{margin-top:16px;padding:14px;border:1.5px dashed var(--line);border-radius:16px;background:#fafcff}
.lf-self-h{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.lf-self-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lf-self-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:15px 8px;border:0;border-radius:14px;color:#fff;cursor:pointer;font-family:'Kanit';font-weight:700;font-size:13.5px;transition:transform .12s,box-shadow .12s}
.lf-self-btn i{font-size:24px}
.lf-self-btn.amber{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 8px 18px rgba(245,158,11,.3)}
.lf-self-btn.sky{background:linear-gradient(135deg,#0ea5e9,#38bdf8);box-shadow:0 8px 18px rgba(14,165,233,.3)}
.lf-self-btn:hover{transform:translateY(-2px)}
.lf-self-btn:active{transform:translateY(0)}
.lf-self-note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}

/* ── self-service full-screen (นักเรียน) ── */
.ss-stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 50% -10%,#eaf2ff,#f6f9ff)}
.ss-card{width:100%;max-width:460px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(15,23,42,.16)}
.ss-head{position:relative;padding:22px 20px 20px;color:#fff;text-align:center}
.ss-head.amber{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.ss-head.sky{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}
.ss-back{position:absolute;left:14px;top:16px;width:38px;height:38px;border:0;border-radius:11px;background:rgba(255,255,255,.22);color:#fff;font-size:18px;cursor:pointer}
.ss-ht{font-family:'Kanit';font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px}
.ss-hs{font-size:12.5px;opacity:.92;margin-top:4px}
.ss-body{padding:20px}
.ss-inrow{display:flex;gap:10px}
.ss-input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:15px 16px;font-size:24px;font-weight:700;font-family:'Kanit';text-align:center;letter-spacing:.12em;color:var(--ink)}
.ss-input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.ss-go{flex:0 0 56px;border:0;border-radius:14px;background:var(--grad);color:#fff;font-size:21px;cursor:pointer}
.ss-stu{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin:16px 0}
.ss-av{width:48px;height:48px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Kanit'}
.ss-nm{font-weight:700;font-size:16px;color:var(--ink)}
.ss-meta{font-size:12.5px;color:var(--ink2);margin-top:2px}
.ss-warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.ss-lbl{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:9px}
.ss-reasons{display:flex;flex-wrap:wrap;gap:8px}
.ss-rbtn{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:11px;padding:10px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Kanit'}
.ss-rbtn.on{background:var(--grad);color:#fff;border-color:transparent}
.ss-field{margin-top:14px}
.ss-field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.ss-tin{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-family:'Sarabun';color:var(--ink)}
.ss-tin:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
#ss-submit{margin-top:18px}
.ss-done{text-align:center;padding:20px 6px}
.ss-check{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,#10b981,#34d399);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 12px 28px rgba(16,185,129,.36);animation:popin .3s ease}
.ss-dt{font-family:'Kanit';font-weight:800;font-size:20px;color:var(--ink)}
.ss-ds{font-size:13px;color:var(--ink2);margin-top:6px}
.ss-dbtns{display:flex;gap:10px;margin-top:20px}
.ss-dbtns .btn{flex:1}

/* ── board รายละเอียดเพิ่ม (เบอร์/ผู้ปกครอง/รูป) ── */
.bmeta2{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bmeta2 i{font-size:12.5px;color:var(--muted)}
.btel{color:var(--blue);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btel:hover{text-decoration:underline}
.board-photo{margin-top:8px;border:1px solid var(--blue);background:#eef5ff;color:var(--blue);border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:700;font-family:'Kanit';cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.board-photo:hover{background:var(--blue);color:#fff}

/* ── lightbox ดูรูป ── */
.photo-lb{display:flex;align-items:center;justify-content:center;background:#0f172a;border-radius:12px;overflow:hidden;min-height:200px}
.photo-lb img{max-width:100%;max-height:70vh;display:block;object-fit:contain}

/* ── self-service: กล้องถ่ายรูป ── */
.ss-cam-box{width:100%;border:2px dashed var(--line);border-radius:14px;background:#f8fbff;color:var(--ink2);padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-family:'Sarabun'}
.ss-cam-box i{font-size:30px;color:var(--blue)}
.ss-cam-box span{font-size:13px;font-weight:600}
.ss-cam-box:active{transform:scale(.98)}
.ss-cam-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ss-cam-box.alt{background:#fff;border-style:solid}
.ss-ta{resize:vertical;min-height:60px;font-family:'Sarabun'}
.ss-other{margin-top:10px}
.ss-cam-prev{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.ss-cam-prev img{width:100%;display:block;max-height:280px;object-fit:cover}
.ss-cam-rm{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(15,23,42,.72);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>

      return '<a class="lp-item" href="' + l.h + '"><span class="lp-ic ' + l.grad + '"><i class="bi bi-' + l.i + '"></i></span><span class="lp-lb">' + esc(l.t) + '</span></a>';

    root.innerHTML =

      '<aside class="sidebar" id="sidebar">' +
        '<div class="sb-head"><div class="sb-logo"><div class="lg"><i class="bi bi-shield-check"></i></div><div class="tx"><b>' + esc(app.name || 'ระบบงานปกครอง') + '</b><span>' + esc(app.org || '') + '</span></div></div>' +
          '<div class="sb-clock"><div class="t" id="sb-time">--:--:--</div><div class="d" id="sb-date">—</div></div></div>' +
        '<div class="sb-user"><div class="av">' + esc(fmt.initials(u.full_name)) + '</div><div class="nm"><b>' + esc(u.full_name) + '</b>' + A.roleChip(u.role) + '</div></div>' +
        '<nav class="sb-nav">' + sbNav +
          '<div class="sb-cat">บัญชี</div><a class="sb-link" href="#/profile"><i class="bi bi-person-circle"></i> โปรไฟล์</a>' +
          '<a class="sb-link is-logout" data-action="logout"><i class="bi bi-box-arrow-right"></i> ออกจากระบบ</a></nav>' +
      '</aside>' +
      '<div class="main-area"><header class="navbar">' +
        '<button class="nav-burger" data-action="nav-toggle"><i class="bi bi-list"></i></button>' +
        '<div class="nav-page"><div class="pi" id="nav-pi"><i class="bi bi-speedometer2"></i></div><div class="tx"><b id="nav-title">แดชบอร์ด</b><span id="nav-sub">ภาพรวม</span></div></div>' +
        '<div class="nav-right"><span class="nav-status"><span class="dot"></span> ออนไลน์</span><span class="nav-clock" id="nav-clock">—</span>' +
          '<button class="nav-btn" data-action="launcher-toggle" title="เมนูทั้งหมด"><i class="bi bi-grid-3x3-gap-fill"></i></button>' +
          '<button class="nav-btn" data-action="bell-toggle" title="แจ้งเตือน"><i class="bi bi-bell"></i><span class="nav-dot" id="nav-bell-dot" style="display:none">0</span></button>' +
          '<button class="nav-prof" data-action="profile-toggle"><span class="av">' + esc(fmt.initials(u.full_name)) + '</span><span class="nm">' + esc(u.full_name) + '</span><i class="bi bi-chevron-down" style="font-size:11px;color:#94a3b8"></i></button>' +
        '</div></header>' +
        '<div class="page-wrap"><div id="page"></div></div>' +
        appFooter() +
      '</div>' +
      bottomNav() +
      profilePop() + bellPop() + launcherPop(launcher);
    A.wireImg(root);
  }

  function appFooter() {
    var d = (Store.boot.app || {}).dev || {};
    return '<footer class="app-footer sd-no-print"><div><span class="af-year">' + new Date().getFullYear() + '</span> © ' + esc((Store.boot.app || {}).name || 'SAM') + ' · v' + esc((Store.boot.app || {}).version || '1.0.0') + '</div>' +
      '<div class="af-dev"><div class="info"><small style="color:#94a3b8">ผู้พัฒนาโดย</small><br><b>' + esc(d.name || '') + '</b> · <a href="' + esc(d.url || '#') + '" target="_blank" rel="noopener noreferrer">' + esc((d.url || '').replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</a></div>' +
      '<a href="' + esc(d.url || '#') + '" target="_blank" rel="noopener noreferrer"><img src="' + esc(d.logo || '') + '" referrerpolicy="no-referrer" class="lh"></a></div></footer>';
  }
  function bottomNav() {
    var role = Store.user.role;
    var items = [{ h: '#/dashboard', i: 'speedometer2', t: 'แดชบอร์ด', cap: 'report.view_own|report.view_all' }];
    if (hasCap('late.create')) items.push({ h: '#/scan/late', i: 'clock-history', t: 'มาสาย', cap: '*' });
    if (hasCap('leave.create')) items.push({ h: '#/scan/leave', i: 'house-heart', t: 'ลากลับ', cap: '*' });
    if (hasCap('behavior.create')) items.push({ h: '#/scan/behavior', i: 'star', t: 'คะแนน', cap: '*' });
    else if (hasCap('student.view_own|student.view_all')) items.push({ h: '#/students', i: 'people-fill', t: 'นักเรียน', cap: '*' });
    items = items.slice(0, 4);
    items.push({ h: '#/menu', i: 'grid-fill', t: 'เมนู', menu: true });
    return '<nav class="bottom-nav">' + items.map(function (it) { return '<a class="bn-item" href="' + (it.menu ? '#/dashboard' : it.h) + '"' + (it.menu ? ' data-action="launcher-toggle"' : ' data-bn="' + it.h + '"') + '><i class="bi bi-' + it.i + '"></i>' + esc(it.t) + '</a>'; }).join('') + '</nav>';
  }
  function profilePop() {
    var u = Store.user;
    return '<div class="pop pop-prof" id="pop-prof"><div class="pop-head"><b>' + esc(u.full_name) + '</b><span>' + esc(u.email || u.username) + '</span></div>' +
      '<div style="padding:8px 0"><div class="pop-item" data-action="open-profile"><i class="bi bi-person"></i> โปรไฟล์ของฉัน</div>' +
      '<div class="pop-item" data-action="change-password"><i class="bi bi-key"></i> เปลี่ยนรหัสผ่าน</div><div class="pop-sep"></div>' +
      '<div class="pop-item danger" data-action="logout"><i class="bi bi-box-arrow-right"></i> ออกจากระบบ</div></div></div>';
  }
  function bellPop() {
    return '<div class="pop pop-bell" id="pop-bell"><div class="bh"><b><i class="bi bi-bell"></i> การแจ้งเตือน</b><button class="lf-link" data-action="mark-all-read">อ่านทั้งหมด</button></div><div class="bl" id="bell-list"><div class="empty" style="padding:24px"><i class="bi bi-bell-slash"></i><div class="s">ยังไม่มีการแจ้งเตือน</div></div></div></div>';
  }
  function launcherPop(links) { return '<div class="launcher-pop" id="launcher-pop"><div class="lp-h">เมนูทั้งหมด</div><div class="lp-grid">' + links + '</div></div>'; }

  function setActiveNav(hash) {
    var base = hash.split('?')[0];
    var best = null, bestLen = 0;
    $$('#sidebar .sb-link[href]').forEach(function (a) { var href = a.getAttribute('href'); if (base === href || base.indexOf(href + '/') === 0) { if (href.length > bestLen) { best = a; bestLen = href.length; } } a.classList.remove('active'); });
    if (base.indexOf('#/report/student') === 0) best = $('#sidebar .sb-link[href="#/students"]');
    if (best) best.classList.add('active');
    var bestHref = best ? best.getAttribute('href') : '';
    $$('.bn-item[data-bn]').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-bn') === bestHref || a.getAttribute('data-bn') === base); });
    var meta = pageMeta(hash), pi = el('nav-pi'), nt = el('nav-title'), ns = el('nav-sub');
    if (pi) pi.innerHTML = '<i class="bi bi-' + meta[0] + '"></i>'; if (nt) nt.textContent = meta[1]; if (ns) ns.textContent = meta[2];
  }

  // ── badge จำนวนที่บันทึกวันนี้บนเมนู sidebar ──
  function loadNavBadges() {
    if (!Store.token || !el('sidebar')) return;
    call('nav.counts', {}).then(function (c) {
      if (!el('sidebar')) return;
      $$('#sidebar .sb-badge[data-nb]').forEach(function (b) {
        var n = Number(c[b.getAttribute('data-nb')] || 0);
        if (n > 0) { b.textContent = n > 99 ? '99+' : n; b.hidden = false; } else { b.hidden = true; }
      });
    }).catch(function () {});
  }
  A.refreshNavBadges = loadNavBadges;

  // ── lightbox ดูรูปหลักฐาน (lh3 · no-referrer) ──
  function openPhoto(url) {
    if (!url) return;
    Modal.open({
      icon: 'image', title: 'รูปหลักฐาน',
      html: '<div class="photo-lb"><img src="' + esc(url) + '" referrerpolicy="no-referrer" alt="รูปหลักฐาน"></div>',
      footer: '<a class="btn btn-soft" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"><i class="bi bi-box-arrow-up-right"></i> เปิดในแท็บใหม่</a><button class="btn btn-ghost" data-action="close-modal">ปิด</button>'
    });
  }
  A.openPhoto = openPhoto;

  // ── กล้องในหน้าเว็บ (ใช้ได้ทั้งกล้องมือถือและ webcam คอม) ──
  // หมายเหตุ: เมื่อเปิดผ่าน Google Apps Script (iframe) เบราว์เซอร์อาจปิดกั้นกล้อง → คืน error ให้ผู้เรียก fallback ไปเลือกไฟล์
  A.hasCamera = function () { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext !== false); };
  A.shrinkImage = function (src, maxPx, q) {   // src = dataURL/objectURL → dataURL ที่ย่อแล้ว
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var sc = Math.min(1, (maxPx || 900) / Math.max(img.width, img.height));
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', q || 0.72));
      };
      img.onerror = function () { reject(new Error('อ่านรูปไม่สำเร็จ')); };
      img.src = src;
    });
  };
  A.fileToPhoto = function (file) {   // ไฟล์จาก <input type="file"> → dataURL ย่อแล้ว
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('ไม่พบไฟล์'));
      if (!/^image\//.test(file.type)) return reject(new Error('กรุณาเลือกไฟล์รูปภาพ'));
      var rd = new FileReader();
      rd.onload = function () { A.shrinkImage(rd.result).then(resolve).catch(reject); };
      rd.onerror = function () { reject(new Error('อ่านไฟล์ไม่สำเร็จ')); };
      rd.readAsDataURL(file);
    });
  };
  A.openCamera = function (opts) {    // → Promise<dataURL> · reject เมื่อยกเลิก/เปิดกล้องไม่ได้
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      if (!A.hasCamera()) return reject(new Error('อุปกรณ์/เบราว์เซอร์นี้เปิดกล้องในหน้าเว็บไม่ได้ — ใช้ปุ่ม "เลือกรูป" แทน'));
      var stream = null, facing = opts.facing || 'environment', done = false;
      var host = document.createElement('div');
      host.className = 'cam-modal';
      host.innerHTML = '<div class="cam-card">' +
        '<div class="cam-h"><span><i class="bi bi-camera-fill"></i> ' + esc(opts.title || 'ถ่ายรูป') + '</span>' +
          '<button type="button" class="cam-x" data-camx aria-label="ปิด"><i class="bi bi-x-lg"></i></button></div>' +
        '<div class="cam-view"><video id="cam-v" autoplay playsinline muted></video><div class="cam-hint" id="cam-hint">กำลังเปิดกล้อง…</div></div>' +
        '<div class="cam-btns"><button type="button" class="btn btn-ghost btn-sm" data-camflip><i class="bi bi-arrow-repeat"></i> สลับกล้อง</button>' +
          '<button type="button" class="cam-shot" data-camshot aria-label="ถ่ายรูป"><i class="bi bi-camera-fill"></i></button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-camx>ยกเลิก</button></div>' +
      '</div>';
      document.body.appendChild(host);
      var v = host.querySelector('#cam-v'), hint = host.querySelector('#cam-hint');
      function stop() { if (stream) { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} stream = null; } }
      function close(err, data) {
        if (done) return; done = true;
        stop(); host.remove(); document.removeEventListener('keydown', onKey);
        if (data) resolve(data); else reject(err || new Error('ยกเลิกการถ่ายรูป'));
      }
      function onKey(e) { if (e.key === 'Escape') close(); }
      function start() {
        stop(); if (hint) hint.textContent = 'กำลังเปิดกล้อง…';
        navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false }).then(function (s) {
          if (done) { try { s.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} return; }
          stream = s; v.srcObject = s; if (hint) hint.remove();
          try { v.play(); } catch (e) {}
        }).catch(function () {
          close(new Error('เปิดกล้องไม่ได้ — โปรดอนุญาตสิทธิ์กล้อง หรือใช้ปุ่ม "เลือกรูป" แทน'));
        });
      }
      host.addEventListener('click', function (e) {
        var t = e.target;
        if (t === host || (t.closest && t.closest('[data-camx]'))) return close();
        if (t.closest && t.closest('[data-camflip]')) { facing = facing === 'user' ? 'environment' : 'user'; start(); return; }
        if (t.closest && t.closest('[data-camshot]')) {
          var w = v.videoWidth, h = v.videoHeight;
          if (!w || !h) { toast('กล้องยังไม่พร้อม รอสักครู่', 'warning'); return; }
          var sc = Math.min(1, 900 / Math.max(w, h));
          var cv = document.createElement('canvas');
          cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
          cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
          close(null, cv.toDataURL('image/jpeg', 0.72));
        }
      });
      document.addEventListener('keydown', onKey);
      start();
    });
  };

  // ── popovers ──
  function togglePop(id) { var p = el(id); if (!p) return; var open = p.classList.contains('show'); closeAllPops(); if (!open) p.classList.add('show'); }
  function closeAllPops() { $$('.pop.show, .launcher-pop.show').forEach(function (p) { p.classList.remove('show'); }); }
  function toggleSidebar() { var s = el('sidebar'); if (s) { s.classList.toggle('open'); var bd = $('.sb-backdrop'); if (bd) bd.classList.toggle('show', s.classList.contains('open')); } }
  function closeSidebar() { var s = el('sidebar'); if (s) s.classList.remove('open'); var bd = $('.sb-backdrop'); if (bd) bd.classList.remove('show'); }

  // ── clock ──
  function startClock() { stopClock(); tick(); Store.clockTimer = setInterval(tick, 1000); }
  function stopClock() { if (Store.clockTimer) { clearInterval(Store.clockTimer); Store.clockTimer = null; } }
  function tick() {
    var now = new Date();
    var t = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2) + ':' + ('0' + now.getSeconds()).slice(-2);
    var st = el('sb-time'); if (st) st.textContent = t;
    var sd = el('sb-date'); if (sd) sd.textContent = 'วัน' + TH.WD[now.getDay()] + ' ' + now.getDate() + ' ' + TH.MS[now.getMonth()] + ' ' + TH.be(now);
    var nc = el('nav-clock'); if (nc) nc.textContent = TH.WD[now.getDay()].substring(0, 2) + ' ' + now.getDate() + ' ' + TH.MS[now.getMonth()] + ' · ' + t.slice(0, 5) + ' น.';
  }

  // ── notifications ──
  function startNotif() { stopNotif(); Store.notifFirst = true; loadNotif(true); loadNavBadges(); Store.notifTimer = setInterval(function () { loadNotif(false); loadNavBadges(); }, 40000); }
  function stopNotif() { if (Store.notifTimer) { clearInterval(Store.notifTimer); Store.notifTimer = null; } }
  function loadNotif(render) {
    if (!Store.token) return;
    call('notify.list', {}).then(function (d) {
      if (!el('nav-bell-dot')) return;
      var dot = el('nav-bell-dot');
      if (d.unread > 0) { dot.style.display = 'flex'; dot.textContent = d.unread > 99 ? '99+' : d.unread; } else dot.style.display = 'none';
      if (!Store.notifFirst && d.latest && d.latest > Store.notifSeen && d.items.length && !d.items[0].is_read) toast('🔔 ' + (d.items[0].title || 'มีการแจ้งเตือนใหม่'), 'info', 3500);
      Store.notifSeen = d.latest || Store.notifSeen; Store.notifFirst = false;
      if (render || $('#pop-bell').classList.contains('show')) renderNotif(d.items);
    }).catch(function () {});
  }
  function renderNotif(items) {
    var host = el('bell-list'); if (!host) return;
    if (!items.length) { host.innerHTML = '<div class="empty" style="padding:24px"><i class="bi bi-bell-slash"></i><div class="s">ยังไม่มีการแจ้งเตือน</div></div>'; return; }
    var icMap = { leave: 'house-heart', behavior: 'star', late: 'clock-history', system: 'info-circle', alert: 'exclamation-triangle' };
    host.innerHTML = items.map(function (n) {
      return '<div class="ni' + (n.is_read === 'no' || n.is_read === false ? ' unread' : '') + '" data-nid="' + esc(n.id) + '"' + (n.link ? ' data-hash="' + esc(n.link) + '"' : '') + '><div class="ic"><i class="bi bi-' + (icMap[n.ntype] || 'bell') + '"></i></div><div class="fb"><div class="tt">' + esc(n.title) + '</div><div class="ms">' + esc(n.message) + '</div><div class="tm">' + TH.smart(n.created_at) + '</div></div></div>';
    }).join('');
    $$('.ni', host).forEach(function (n) { n.addEventListener('click', function () { var id = n.getAttribute('data-nid'); call('notify.mark_read', { id: id }).then(function () { loadNotif(true); }); closeAllPops(); }); });
  }

  // ── profile / password ──
  function openProfile() {
    var u = Store.user;
    Modal.open({
      title: 'โปรไฟล์ของฉัน', icon: 'person-circle',
      html: '<div style="text-align:center;margin-bottom:16px"><div class="avatar lg" style="margin:0 auto 10px">' + esc(fmt.initials(u.full_name)) + '</div>' + A.roleChip(u.role) + '</div>' +
        '<form id="prof-form"><div class="field"><label>ชื่อ-สกุล <span class="req">*</span></label><input class="input" name="full_name" value="' + esc(u.full_name) + '"></div>' +
        '<div class="field"><label>อีเมล</label><input class="input" name="email" value="' + esc(u.email || '') + '"></div>' +
        '<div class="field"><label>เบอร์โทร</label><input class="input" name="phone" value="' + esc(u.phone || '') + '"></div>' +
        (u.advisor_class ? '<div class="field-hint">ครูที่ปรึกษา ม.' + esc(u.advisor_class) + '/' + esc(u.advisor_room) + '</div>' : '') + '</form>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">ปิด</button><button class="btn btn-primary" id="prof-save"><i class="bi bi-check-lg"></i> บันทึก</button>',
      onOpen: function (card) {
        $('#prof-save', card).addEventListener('click', function (ev) {
          var f = $('#prof-form', card);
          A.runBtn(ev.currentTarget, function () {
            return call('profile.update', { full_name: f.full_name.value, email: f.email.value, phone: f.phone.value }).then(function (r) {
              Store.user = r.user; Store.boot.me = r.user; toast('บันทึกโปรไฟล์แล้ว', 'success'); Modal.close(); renderShell(); setActiveNav(location.hash);
            });
          }).catch(function () {});
        });
      }
    });
  }
  function openChangePw() {
    Modal.open({
      title: 'เปลี่ยนรหัสผ่าน', icon: 'key',
      html: '<form id="pw-form"><div class="field"><label>รหัสผ่านเดิม <span class="req">*</span></label><input class="input" type="password" name="old"></div>' +
        '<div class="field"><label>รหัสผ่านใหม่ <span class="req">*</span></label><input class="input" type="password" name="np"><div class="field-hint">อย่างน้อย 6 ตัวอักษร</div></div>' +
        '<div class="field"><label>ยืนยันรหัสผ่านใหม่ <span class="req">*</span></label><input class="input" type="password" name="cf"></div></form>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">ยกเลิก</button><button class="btn btn-primary" id="pw-save"><i class="bi bi-check-lg"></i> เปลี่ยนรหัสผ่าน</button>',
      onOpen: function (card) {
        $('#pw-save', card).addEventListener('click', function (ev) {
          var f = $('#pw-form', card);
          if (f.np.value !== f.cf.value) { toast('รหัสผ่านใหม่ไม่ตรงกัน', 'warning'); return; }
          if (f.np.value.length < 6) { toast('รหัสผ่านใหม่ต้องอย่างน้อย 6 ตัว', 'warning'); return; }
          A.runBtn(ev.currentTarget, function () {
            return call('auth.change_password', { old_password: f.old.value, new_password: f.np.value }).then(function () { toast('เปลี่ยนรหัสผ่านสำเร็จ', 'success'); Modal.close(); });
          }).catch(function () {});
        });
      }
    });
  }

  function doLogout() {
    A.confirm({ title: 'ออกจากระบบ?', message: 'คุณต้องการออกจากระบบใช่หรือไม่', okText: 'ออกจากระบบ', danger: true }).then(function (ok) {
      if (!ok) return;
      var tk = Store.token;
      Store.token = ''; Store.user = null; Store.caps = [];
      try { localStorage.removeItem('sam.token'); } catch (e) {}
      try { call('auth.logout', {}).catch(function () {}); } catch (e) {}
      stopClock(); stopNotif(); Modal.close(); closeAllPops();
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      renderLogin(); toast('ออกจากระบบแล้ว', 'success', 2000);
    });
  }

  A.renderShell = renderShell;
  A.setActiveNav = setActiveNav;
})();
</script>
